# Locked tool versions reproduce the canonical native development environment (ADR-0053).
[settings]
lockfile = true

[tools]
rust = [
  { version = "1.99.1", profile = "minimal", components = [
    "clippy",
    "rustfmt",
    "rust-src",
    "llvm-tools-preview",
  ], targets = [
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
  ] },
  { version = "nightly-2026-07-15", profile = "minimal", components = [
    "rust-src",
    "miri",
  ] },
]
bun = "1.4.4"
node = "24.22.3"
go = "1.27.4"
just = "1.59.0"
zig = "0.17.0"
lefthook = "2.2.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"
taplo = "0.10.0"
pandoc = "3.13"
tree-sitter = "0.27.2"
"github:crate-ci/typos" = "v1.52.2"
"github:crate-ci/committed" = "v1.1.12"
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-audit" = "0.23.0"
"cargo:cargo-auditable" = "0.7.7"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-semver-checks" = "0.51.0"
"cargo:cargo-release" = "1.1.7"
"cargo:cargo-cyclonedx" = "0.5.10"
"cargo:cargo-edit" = "0.13.14"
"cargo:cargo-insta" = "1.49.0"
"cargo:cargo-outdated" = "0.19.0"
"cargo:bacon" = "3.26.0"
"cargo:git-cliff" = "2.14.2"
"cargo:wasm-pack" = "0.15.1"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-shear" = "1.14.0"
"cargo:kani-verifier" = { version = "0.68.0", os = ["linux", "macos"] }
uv = "0.13.7"
"pipx:reuse" = "6.3.0"
"npm:quicktype" = "26.0.0"
"npm:binaryen" = "132.0.0"
