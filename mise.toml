# Native development toolchain. `rust-toolchain.toml`, Cargo.lock and the
# language-specific lockfiles remain their respective sources of truth.
[settings]
lockfile = true

[tools]
rust = [
  { version = "1.97.0", profile = "minimal", components = [
    "clippy",
    "rustfmt",
    "rust-src",
    "llvm-tools-preview",
  ], targets = [
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
  ] },
  { version = "nightly-2026-07-15", profile = "minimal", components = [
    "rust-src",
    "miri",
  ] },
]
bun = "1.3.14"
node = "24.16.0"
go = "1.26.4"
just = "1.51.0"
lefthook = "2.1.9"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.28.0"
taplo = "0.10.0"
pandoc = "3.10.1"
tree-sitter = "0.26.10"
"github:crate-ci/typos" = "1.47.2"
"github:crate-ci/committed" = "1.1.11"
"cargo:cargo-nextest" = "0.9.136"
"cargo:cargo-deny" = "0.19.7"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-semver-checks" = "0.48.0"
"cargo:cargo-release" = "1.1.2"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-insta" = "1.48.0"
"cargo:cargo-outdated" = "0.19.0"
"cargo:bacon" = "3.24.0"
"cargo:git-cliff" = "2.13.1"
"cargo:wasm-pack" = "0.15.0"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-shear" = "1.13.1"
uv = "0.12.0"
"pipx:reuse" = "6.2.0"
"npm:quicktype" = "23.2.6"
"npm:binaryen" = "130.0.0"
