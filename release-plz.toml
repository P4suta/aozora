[workspace]
# Recovery dispatches must publish prepared versions even when the commit is not from a Release PR.
release_always = true
publish = true
semver_check = true
# Dependency upgrades belong to Renovate rather than release version proposals.
dependencies_update = false
# The release PR protection workflow identifies branches by this prefix.
pr_branch_prefix = "release-plz-"
pr_labels = ["autorelease: pending"]

# A single aozora tag identifies the lockstep workspace release (ADR-0038).
git_tag_enable = false
# The artifact release workflow owns GitHub Release creation (ADR-0038).
git_release_enable = false

changelog_path = "./CHANGELOG.md"
changelog_update = false

[[package]]
name = "aozora"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_include = [
  "aozora-cli",
  "tree-sitter-aozora",
]

# GitHub squash subjects already include PR numbers, so the template avoids appending them twice.
[changelog]
protect_breaking_commits = true
header = """
# Changelog

All notable changes to aozora are recorded in
this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/); the project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}⚠ **BREAKING** — {% endif %}{% if commit.remote.pr_number %}{{ commit.message | upper_first | split(pat=" (#") | first }} (#{{ commit.remote.pr_number }}){% else %}{{ commit.message | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chore" },
  { message = "^revert", group = "Reverted" },
]
