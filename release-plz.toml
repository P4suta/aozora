# release-plz — workspace version automation + crates.io publishing.
#
# Conventional Commits land on main → release-plz keeps a single "Release PR"
# open that bumps the one [workspace.package].version and the root CHANGELOG.md.
# Merging that PR (a deliberate, manual squash-merge) makes release-plz publish
# every public crate to crates.io (dependency-ordered, OIDC trusted publishing)
# and cut a single `vX.Y.Z` tag — which fires release.yml (binaries + GitHub
# Release) and the tag-driven PyPI / npm / extism publishers. Humans never
# hand-edit a version or hand-push a release tag.
#
# Lockstep, single-tag, single-changelog — all three reduce to "suppress at the
# workspace level, enable only on the `aozora` umbrella crate", making that one
# crate the canonical release identity.

[workspace]
# Release ONLY when the Release PR is merged (not on every push to main).
release_always = false
# Publish every public crate to crates.io, in the dependency order release-plz
# derives from the workspace graph.
publish = true
# cargo-semver-checks gate on every Release PR (mirrors `just semver`).
semver_check = true
# Do not refresh third-party dependencies inside the Release PR; that is
# Dependabot's job. release-plz still rewrites Cargo.lock for the version bump.
dependencies_update = false
# Default branch prefix; spelled out because require-signed-commits.json's App
# bypass and the no-automerge-on-release-pr.yml guard both key on it.
pr_branch_prefix = "release-plz-"
# Consumed by ci.yml's `release-gate`: a maintainer must add `release: approved`.
pr_labels = ["autorelease: pending"]

# --- single tag + single GitHub Release ownership --------------------------
# Suppress the default per-package `<pkg>-vX.Y.Z` tags (they start "aozora-…"
# and would never match release.yml's `on: push: tags: ['v*']`). release.yml
# owns the GitHub Release, so release-plz never creates one.
git_tag_enable = false
git_release_enable = false

# --- single aggregated CHANGELOG.md at the repo root -----------------------
# Every crate inherits this path, but changelog writing is disabled below for
# all but `aozora`, so we get one root CHANGELOG.md, not 18 per-crate files.
changelog_path = "./CHANGELOG.md"
changelog_update = false

# The `aozora` umbrella crate is the single release identity: it alone cuts the
# `vX.Y.Z` tag and owns the aggregated changelog.
[[package]]
name = "aozora"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
# Fold every other publishable crate's commits into the one root changelog
# section (each commit is owned by exactly one crate by path, so this is the
# union of all commits, with none counted twice).
changelog_include = [
  "aozora-buildstamp",
  "aozora-cli",
  "aozora-cst",
  "aozora-encoding",
  "aozora-fmt",
  "aozora-i18n",
  "aozora-lsp",
  "aozora-pandoc",
  "aozora-pipeline",
  "aozora-proptest",
  "aozora-query",
  "aozora-render",
  "aozora-scan",
  "aozora-spec",
  "aozora-syntax",
  "aozora-veb",
  "tree-sitter-aozora",
]

# --- changelog rendering (git-cliff syntax) --------------------------------
# Keep-a-Changelog body so CHANGELOG.md and the GitHub Release page agree.
# A GitHub squash-merge subject already ends in " (#N)", so appending
# commit.remote.pr_number on top of it would double the reference
# ("… (#72) (#72)"). When a PR number is known we strip the subject's trailing
# " (#N)" (split on " (#", keep the head) and append the canonical one;
# otherwise the subject is rendered verbatim so a bare reference is never lost.
[changelog]
protect_breaking_commits = true
header = """
# Changelog

All notable changes to aozora are recorded in
this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/); the project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.remote.pr_number %}{{ commit.message | upper_first | split(pat=" (#") | first }} (#{{ commit.remote.pr_number }}){% else %}{{ commit.message | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chore" },
  { message = "^revert", group = "Reverted" },
]
