# aozora workspace compose file. Every `just` target runs a command here.
#
# Services:
#   dev  — interactive development (VS Code Dev Containers attaches here)
#   ci   — identical to dev; used by CI and `just ci` for provenance separation
#   book — lean mdbook serve / build container (port 3000)
#
# Volumes are named so cargo registry + target + sccache persist between runs.

name: aozora

x-common-env: &common-env
  # Cargo caches live at /cargo/* — OUTSIDE the /workspace bind mount — on
  # purpose. Nesting a named volume inside the bind mount (the old
  # /workspace/target etc.) makes the Docker daemon create the host-side
  # mountpoint (./target, ./.cargo, ./.sccache) as **root**, which then
  # blocks host-side cargo — the `smoke-ffi` / `pgo` recipes build on the
  # host — with "failed to create directory ... Permission denied", and
  # litters the working tree with root-owned junk. Keeping the caches at
  # /cargo/* leaves the host's own ./target free for host builds and keeps
  # the checkout clean. The named volumes still persist them between runs.
  CARGO_HOME: /cargo/home
  CARGO_TARGET_DIR: /cargo/target
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /cargo/sccache
  # sccache cannot cache crates compiled with cargo's incremental mode.
  # Cargo defaults incremental=true for workspace members in dev/test profiles,
  # which silently bypasses sccache for the very crates we build most often.
  # Pinning this here applies to every service that inherits x-common-env.
  CARGO_INCREMENTAL: "0"
  SCCACHE_CACHE_SIZE: "10G"
  RUST_BACKTRACE: "1"
  # Use mold (already apt-installed in the Dockerfile toolchain stage).
  # The Dockerfile also writes a /root/.cargo/config.toml with the same
  # intent, but CARGO_HOME=/cargo/home above means cargo never
  # reads it; cargo's own config-discovery is rooted at $CARGO_HOME and
  # only walks ancestor `.cargo/config.toml` files from the project
  # directory upward. Setting target-scoped env vars short-circuits the
  # whole config-file dance and is the documented override path.
  #
  # CRUCIAL: scope mold to the host triple via
  # `CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS`. A plain
  # `RUSTFLAGS=-fuse-ld=mold` would leak into `wasm-pack build
  # --target wasm32-unknown-unknown` and fail with "rust-lld: error:
  # unknown argument: -fuse-ld=mold" — the wasm linker is rust-lld,
  # not mold. The per-target form keeps host builds fast without
  # breaking wasm builds.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "clang"
  TERM: ${TERM:-xterm-256color}
  # /workspace is bind-mounted from the host. Locally the container runs as
  # the matching host UID (1000) so git is happy; in CI it runs as root
  # (AOZORA_UID=0) over a checkout owned by the runner's UID, and git then
  # refuses operations with "dubious ownership". Whitelist via the
  # GIT_CONFIG_* triplet rather than baking a `git config` invocation into
  # the image (keeps the whitelist local to the compose surface).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "/workspace"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: aozora-dev:local
    working_dir: /workspace
    # Runtime UID/GID. Unset locally → 1000 (the image's baked `dev` user,
    # matched to the conventional host UID) so bind-mount writes are
    # host-owned. CI sets AOZORA_UID=0/AOZORA_GID=0 (setup-dev-image) → root,
    # since the runner's checkout is owned by a different UID and ownership
    # is throwaway on the ephemeral runner.
    user: "${AOZORA_UID:-1000}:${AOZORA_GID:-1000}"
    environment: *common-env
    volumes:
      - .:/workspace:cached
      - cargo-registry:/cargo/home/registry
      - cargo-git:/cargo/home/git
      - cargo-target:/cargo/target
      - sccache:/cargo/sccache
    init: true
    tty: true
    stdin_open: true

  ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: ci
    image: aozora-ci:local
    working_dir: /workspace
    user: "${AOZORA_UID:-1000}:${AOZORA_GID:-1000}"  # see `dev` service
    environment:
      <<: *common-env
      CI: "true"
    volumes:
      # `:cached` (writable): CI steps emit artifacts back into the tree
      # (wasm `pkg/`, generated docs, coverage reports), so the source
      # mount stays writable. The cargo caches now live at /cargo/*
      # (outside this bind mount), so the old ":ro hides the nested
      # /workspace/{target,.cargo,.sccache} mountpoints" hazard is gone.
      - .:/workspace:cached
      - cargo-registry:/cargo/home/registry
      - cargo-git:/cargo/home/git
      - cargo-target:/cargo/target
      - sccache:/cargo/sccache

  book:
    # Lean container with just `mdbook` / `mdbook-mermaid` / `lychee` —
    # no Rust toolchain, no sccache. Use `just book-serve` for live
    # preview at http://localhost:3000, `just book-build` for one-shot
    # rendering, `just book-linkcheck` for lychee.
    build:
      context: .
      dockerfile: Dockerfile
      target: book
    image: aozora-book:local
    working_dir: /workspace/crates/aozora-book
    user: "${AOZORA_UID:-1000}:${AOZORA_GID:-1000}"  # see `dev` service
    volumes:
      - .:/workspace:cached
    ports:
      - "3000:3000"

  playground:
    # Vite dev server for the Solid + CodeMirror 6 + WASM playground.
    #
    # Workflow:
    #   1. `docker compose run --rm playground bun install` (first time)
    #   2. `docker compose up playground`  →  http://localhost:5173/aozora/playground/
    #
    # The pkg/ directory that vite.config.ts aliases lives at
    # /workspace/crates/aozora-wasm/pkg and is generated by
    # `docker compose run --rm dev wasm-pack build --target web --release crates/aozora-wasm`
    # ahead of time. A volume mount keeps node_modules off the host
    # filesystem so the same checkout works seamlessly between host
    # and container.
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: aozora-dev:local
    working_dir: /workspace/playground
    user: "${AOZORA_UID:-1000}:${AOZORA_GID:-1000}"  # see `dev` service
    environment:
      <<: *common-env
      # Vite reads HOST=0.0.0.0 to bind on all interfaces inside the
      # container; without this the dev server only listens on localhost
      # which is unreachable from the host.
      HOST: "0.0.0.0"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    volumes:
      - .:/workspace:cached
      # node_modules and dist are container-only — keeping them off the
      # host bind mount avoids platform-specific binaries (esbuild,
      # native bun cache) bleeding into a non-Linux host.
      - playground-node-modules:/workspace/playground/node_modules
      - playground-dist:/workspace/playground/dist
      - cargo-registry:/cargo/home/registry
      - cargo-git:/cargo/home/git
      - cargo-target:/cargo/target
    ports:
      - "5173:5173"
    init: true

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  sccache:
  playground-node-modules:
  playground-dist:
