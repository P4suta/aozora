# Rust toolchain + cargo-built dev tools for host iteration on aozora.
# mise merges this with mise.toml (same directory, tool-level union).
#
# aozora's canonical build/test environment is the Docker image (the
# dev-image CI builds and runs every job inside it); this manifest lets
# contributors run the fast inner loop on the host via mise, while
# `just ci` in the container stays the authoritative merge gate.
#
# There is deliberately NO `rust = "..."` entry: mise reads
# rust-toolchain.toml natively, so leaving rust out makes the host lane
# derive the channel instead of restating it. A pin here would WIN over
# rust-toolchain.toml, so the two could drift apart silently and the host
# would build with a different rustc than the container.
#
# cargo-shear (stable) is the unused-dependency gate — it runs both in the
# host inner loop and the audit workflow, replacing the former
# nightly-only cargo-udeps.
#
# cargo-mutants is PINNED, not `latest`, unlike the tools above: the
# mutation ratchet (mutants-baseline.json, ADR-0031) is only sound if the
# host `just mutants-host` sweep enumerates the SAME mutants as the CI
# Docker `just mutants` sweep. Mutant enumeration is a deterministic
# function of (source AST × cargo-mutants version), so the two lanes agree
# only while both run the identical version — the host mise pin here and
# the Dockerfile `cargo install --version` must move together (grep both).
[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-deny" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-shear" = "latest"
