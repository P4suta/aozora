# cargo-deny configuration for the aozora workspace.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Both entries are `unmaintained` advisories (no vulnerability, no fix to
# apply) on transitive deps that enter the graph ONLY through
# `iai-callgrind` — a DEV-dependency of `aozora-bench`, which is
# `publish = false` (the G6 instruction-count perf gate). Neither reaches a
# published crate or a shipped binary:
#   - proc-macro-error2: a compile-time proc-macro dep of
#     iai-callgrind-macros — never present in any runtime artifact.
#   - bincode: iai-callgrind's benchmark-output serializer (dev tooling only).
# iai-callgrind 0.16.1 is the latest release; no upgrade drops either crate.
# Revisit when iai-callgrind migrates off them.
ignore = [
  "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained
  "RUSTSEC-2025-0141", # bincode unmaintained
]

[licenses]
version = 2
# Our crates are Apache-2.0 OR MIT. The list below is the union of
# allowed licenses across the transitive dep graph.
#
# MIT-0 (MIT No Attribution) is OSI-approved and strictly more
# permissive than MIT. Listed defensively so a future transitive
# dep on an MIT-0 crate (a growing convention for tiny
# micro-utility crates on crates.io) lands without a policy
# decision in the moment.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "Zlib",
  # BSL-1.0 (Boost Software License 1.0) covers rustyline's Windows-only
  # clipboard-win/error-code deps — OSI-approved, permissive, and not
  # shipped in the Linux binary.
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates used only as dev-dependencies are declared path-only
# (no `version`) so cargo strips them from the published manifest — see
# the note in `[workspace.dependencies]` (Cargo.toml). Those path-only
# deps resolve as wildcards (`*`); allow wildcards specifically when the
# dependency is a path dependency so `wildcards = "deny"` still rejects a
# stray wildcard on a registry dep.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
