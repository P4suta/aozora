[workspace]
resolver = "3"
members = [
  "crates/aozora",
  "crates/aozora-cli",
  "crates/tree-sitter-aozora",
  "crates/aozora-corpus",
  "crates/aozora-proptest",
  "crates/aozora-conformance",
  "crates/aozora-ffi",
  "crates/aozora-wasm",
  "crates/aozora-extism",
  "crates/aozora-py",
  "crates/aozora-bench",
  "crates/aozora-xtask",
  "crates/aozora-trace",
]
exclude = ["crates/aozora-go"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# rustyline's file_lock use sets the measured MSRV (ADR-0034).
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "Aozora Bunko notation (青空文庫記法) parser: ruby, bouten, 縦中横, 外字, kaeriten, indent containers, page breaks"
repository = "https://github.com/P4suta/aozora"
homepage = "https://p4suta.github.io/aozora/"
authors = ["aozora contributors"]
readme = "README.md"
keywords = ["aozora", "japanese", "typography", "parser", "ruby"]
categories = ["parser-implementations", "text-processing", "localization"]

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"

missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

unreachable_pub = "warn"
single_use_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
redundant_lifetimes = "warn"
explicit_outlives_requirements = "warn"

let_underscore_drop = "warn"
keyword_idents_2024 = "warn"
# Parser payloads remain inline to preserve Copy semantics (ADR-0036).
variant_size_differences = "allow"
ambiguous_negative_literals = "warn"

dead_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
clone_on_ref_ptr = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
missing_assert_message = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"

str_to_string = "warn"
absolute_paths = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
let_underscore_must_use = "warn"
mixed_read_write_in_expression = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
try_err = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
format_push_string = "warn"
unnecessary_self_imports = "warn"
assertions_on_result_states = "warn"
filetype_is_file = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
lossy_float_literal = "warn"
suspicious_xor_used_as_pow = "warn"

# Workspace lint exceptions follow docs/adr/repository-lint-exceptions.md.
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
# Boxing parser payloads would add allocation and indirection to the lexer hot path (ADR-0036).
large_enum_variant = "allow"

[workspace.dependencies]
aozora = { version = "0.5.0", path = "crates/aozora" }
tree-sitter-aozora = { version = "0.5.0", path = "crates/tree-sitter-aozora" }
aozora-trace = { path = "crates/aozora-trace" }

bumpalo = { version = "3.20", features = ["collections"] }

smallvec = "1.15"

memchr = "2.8"

aho-corasick = { version = "1.1", default-features = false }
aozora-corpus = { path = "crates/aozora-corpus" }
aozora-proptest = { path = "crates/aozora-proptest" }

thiserror = "2.0.18"
anyhow = "1.0"
miette = { version = "7.6.0" }
regex = "1.12"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
flate2 = "1.1"

addr2line = { version = "0.27.1", default-features = false }
object = { version = "0.40", default-features = false, features = ["read"] }

encoding_rs = "0.8.35"

phf = { version = "0.14", features = ["macros"] }

walkdir = "2.5"

similar = { version = "3.1", default-features = false, features = ["text"] }
anstream = "1.0"
anstyle = "1.0"
indicatif = "0.18"

tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync", "time"] }
dashmap = "6"
parking_lot = "0.13"
arc-swap = "1.7"
ropey = { version = "1.6", default-features = false, features = [
  "simd",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hdrhistogram = { version = "=7.5.4", default-features = false }

pandoc_ast = "0.8"

comfy-table = { version = "7.2", default-features = false }

num_cpus = "1.16"
num-traits = "0.2.19"

zstd = "0.14"

blake3 = "1.5"

rustix = { version = "1.1", features = ["fs"] }

tempfile = "3.27"

rayon = "1.12"

clap = { version = "4.6.1", features = ["derive", "wrap_help", "env", "color", "cargo"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.3"
notify = "8.2"
rustyline = "18.0"

ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm"] }

fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
fluent-langneg = "0.13"

insta = { version = "1.47", features = ["yaml", "json", "filters"] }
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
dhat = "0.3"
pretty_assertions = "1.4.1"
mutants = "0.0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dist]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
strip = "none"
debug = 1

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
