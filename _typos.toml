# Spelling allowances follow docs/adr/spelling-allowances.md.
[default]
extend-ignore-identifiers-re = [
  "[A-Fa-f0-9]{7,}",
]

[default.extend-words]
afm = "afm"
bre = "bre"
Dostoyevsky = "Dostoyevsky"
Fyodor = "Fyodor"
Yonekawa = "Yonekawa"
Masao = "Masao"
Yasunobu = "Yasunobu"
gya = "gya"
myu = "myu"
ba = "ba"

[files]
extend-exclude = [
  "spec/aozora/fixtures/",
  "crates/aozora/data/",
  "target/",
  "coverage/",
  "mutants.out/",
  "mutants.out.old/",
  "mutants-*/",
  "*.html",
  "*.lock",
]
