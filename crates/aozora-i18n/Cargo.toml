[package]
name = "aozora-i18n"
description = "Localization layer for the aozora CLI and LSP: a Project Fluent (.ftl) message catalog with locale negotiation. Shell strings only — the machine output axis is never localized."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
fluent-langneg = { workspace = true }

[dev-dependencies]
# The live diagnostic catalogue, so the catalog-parity test drives itself off
# `Diagnostic::ALL_CODES` instead of a hand-copied list. Test-only: this crate
# stays a leaf for consumers. Path-only (no `version`) per the workspace root's
# internal-dev-dep rule, which keeps it out of the published manifest.
aozora-spec = { path = "../aozora-spec" }
# Fluent's AST, so the catalog-parity test reads each locale's message ids out
# of the resource Fluent itself parsed instead of re-scanning `.ftl` text with a
# second grammar. Test-only: production code never walks the AST.
fluent-syntax = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
