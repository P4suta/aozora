[package]
name = "aozora-extism"
description = "Extism (WASM) plugin driver for the aozora parser — one portable artifact, polyglot host SDKs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

publish = false

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1.4"

[dependencies]
aozora = { workspace = true, features = ["json"] }

[features]
host-smoke = ["dep:extism"]

[dev-dependencies]
mutants = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true }
extism = { version = "1.41.0", optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "aozora-real-work-extism"
path = "src/bin/aozora-real-work-extism.rs"
required-features = ["host-smoke"]
