[package]
name = "aozora-veb"
description = "Cache-friendly sorted-collection lookup for the aozora pipeline (Eytzinger layout, no_std). Internal crate; depend on the aozora umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# (none) — core algorithm is no_std + alloc only.

[dev-dependencies]
proptest = { workspace = true }
aozora-proptest = { path = "../aozora-proptest" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
