[package]
name = "aozora-cli"
description = "Command-line frontend for the aozora parser: check / fmt against Aozora Bunko notation files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "aozora"
path = "src/main.rs"

[dependencies]
# `schema` enables `aozora::json::schema_*()` and pulls schemars in for
# the `aozora schema` introspection subcommand. CLI is the only
# binary that needs schema runtime, so feature-gating here keeps the
# library `aozora` crate light for plain library consumers.
aozora = { workspace = true, features = ["schema"] }
# Direct dep on the internal lexer crate: the diagnostics renderer reaches
# `aozora_pipeline::lexer::sanitize` for caret placement — an internal,
# no-contract surface the umbrella deliberately does not re-export.
aozora-pipeline = { workspace = true }
aozora-buildstamp = { workspace = true } # channel-aware `--version` stamp
aozora-fmt = { workspace = true } # shared format core + the `Encoding` decoder
aozora-pandoc = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
clap_mangen = { workspace = true }
comfy-table = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
# Golden-fixture loader for the cross-surface parity gate
# (`tests/fixture_parity.rs`). Declared path-only (no version) on
# purpose: aozora-conformance is a dev-only, `publish = false` crate, so
# cargo STRIPS this dev-dependency from the published manifest. A
# versioned dev-dep would make crates.io require aozora-conformance to
# exist on the registry and would fail the `aozora-cli` publish.
aozora-conformance = { path = "../aozora-conformance" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
