[package]
name = "aozora-cli"
description = "Command-line frontend for the aozora parser: check / fmt against Aozora Bunko notation files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
include = [
  "src/**",
  "tests/**/*.rs",
  "build.rs",
  "locales/*.ftl",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[lints]
workspace = true

[[bin]]
name = "aozora"
path = "src/main.rs"
doc = false

[dependencies]
aozora = { workspace = true, features = [
  "schema",
  "fmt",
  "pandoc",
] }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
clap_mangen = { workspace = true }
comfy-table = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
rustyline = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-textarea-2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
fluent-langneg = { workspace = true }

similar = { workspace = true }
walkdir = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
indicatif = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
encoding_rs = { workspace = true }

tower-lsp = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
ropey = { workspace = true }
hdrhistogram = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# ADR-0031 uses predicate tests for live progress widgets marked with `mutants::skip`.
mutants = { workspace = true }
aozora-conformance = { path = "../aozora-conformance" }
proptest = { workspace = true }
tower = "0.5"
futures = "0.3"
fluent-syntax = { workspace = true }
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
