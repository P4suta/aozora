[package]
name = "aozora-query"
description = "tree-sitter-flavoured pattern queries over the aozora concrete syntax tree. Internal crate; reach it via the aozora crate's `query` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
aozora-cst = { workspace = true }
rowan = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
aozora = { path = "../aozora", features = ["cst", "query"] }
# tests/integration.rs sanitises input via `aozora_pipeline::lexer::sanitize`
# (internal, no-contract surface not re-exported by the umbrella).
aozora-pipeline = { path = "../aozora-pipeline" }
proptest = { workspace = true }
aozora-proptest = { path = "../aozora-proptest" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
