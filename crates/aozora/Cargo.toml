[package]
name = "aozora"
description = "Aozora Bunko notation parser with incremental document snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
build = "build.rs"
include = [
  "src/**/*.rs",
  "build.rs",
  "data/*.tsv",
  "assets/aozora-notation.css",
  "examples/**/*.rs",
  "tests/**/*.rs",
  "tests/*.proptest-regressions",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[lints]
workspace = true

[[example]]
name = "real_work_worker"
path = "examples/real_work_worker.rs"
required-features = ["json"]

[dependencies]
memchr = { workspace = true }
aho-corasick = { workspace = true }
bumpalo = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
encoding_rs = { workspace = true }
phf = { workspace = true }
ropey = { workspace = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
pandoc_ast = { workspace = true, optional = true }
[features]
default = []
json = ["dep:serde", "dep:serde_json", "serde_json/preserve_order"]
schema = ["json", "dep:schemars"]
fmt = []
pandoc = ["dep:pandoc_ast"]
[build-dependencies]
phf_codegen = "0.14"

[dev-dependencies]
# A path-only aozora-corpus dependency keeps the unpublished helper out of the published dependency graph.
aozora-corpus = { path = "../aozora-corpus" }
proptest = { workspace = true }
aozora-proptest = { path = "../aozora-proptest" }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
# ADR-0031 requires mutants::skip markers in tests.
mutants = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
