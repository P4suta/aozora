[package]
name = "aozora"
description = "Aozora Bunko notation parser — single front door (Document + Tree)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Document wraps `aozora_pipeline::lex` and Tree
# borrows from a `bumpalo`-backed arena owned by Document. The five
# building-block crates below are published in their own right (the
# umbrella is on crates.io, so its transitive deps must be too); this
# meta crate is the recommended single front door, re-exposing them via
# the `aozora::pipeline` / `aozora::syntax` / `aozora::render` /
# `aozora::encoding` modules so most consumers depend on just `aozora`.
aozora-render = { workspace = true }
aozora-pipeline = { workspace = true }
aozora-syntax = { workspace = true }
aozora-spec = { workspace = true }
aozora-encoding = { workspace = true }

# Driver-shared wire format (see `aozora::json`). Optional so library
# consumers that only use the borrowed-AST surface do not have to
# compile serde / serde_json. Drivers (aozora-ffi / aozora-wasm /
# aozora-py) enable `aozora/json` to project the AST into JSON.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# JSON Schema generation for the wire format. Optional, enabled by
# the `schema` feature only — most wire consumers don't need
# `schema_*()` functions and shouldn't pull schemars into their
# dep tree.
schemars = { workspace = true, optional = true }
# Phase N4 — Aozora-shaped proptest generators. Optional, enabled
# only by the `proptest` feature so library consumers don't pay
# the proptest dep cost unless they're writing property tests
# themselves.
aozora-proptest = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
# Phase N1 — lossless concrete syntax tree. Optional, enabled by
# the `cst` feature so library-only consumers don't pull in rowan
# unless they want the editor-grade surface.
aozora-cst = { workspace = true, optional = true }
# Phase N5 — tree-sitter-flavoured query DSL over the CST.
# Optional, enabled by the `query` feature; pulls aozora-cst (and
# transitively rowan) into the dep tree.
aozora-query = { workspace = true, optional = true }

[features]
default = []
# JSON wire format projection used by FFI / WASM / PyO3 drivers.
# Enables `aozora::json::diagnostics` /
# `nodes` / `pairs` and the `SCHEMA_VERSION`
# constant — the single authority for cross-language wire output.
#
# `serde_json/preserve_order` makes `serde_json::Value` keep insertion
# order (IndexMap, not the default sorted BTreeMap). The wire functions
# emit from structs, so their field order is already canonical; this
# only matters for callers (and the `property_json_round_trip` test)
# that round-trip the envelope through `Value` and rely on byte-stable
# key order. Pinning it to `json` makes the byte-canonical contract
# self-contained instead of silently depending on `schema` pulling in
# schemars (which also enables `preserve_order`).
json = ["dep:serde", "dep:serde_json", "serde_json/preserve_order"]
# JSON Schema introspection for the wire format. Enables
# `aozora::json::schema_diagnostics` / `schema_nodes` /
# `schema_pairs` / `schema_container_pairs` (one per envelope).
# Used by `xtask schema dump` and the introspection CLI subcommand.
schema = ["json", "dep:schemars"]
# Aozora-shaped proptest generators (`aozora::proptest::*`).
# Downstream renderer authors enable this when writing property
# tests over their own `AozoraVisitor` impls.
proptest = ["dep:proptest", "dep:aozora-proptest"]
# Lossless concrete syntax tree (`aozora::cst::*`). Editor-grade
# surface for source-faithful refactoring / formatters / LSP
# servers. Pulls rowan into the dep tree.
cst = ["dep:aozora-cst"]
# Tree-sitter-flavoured query DSL (`aozora::query::*`) over the
# CST. Implies `cst` (queries run against `SyntaxNode`); pulls
# aozora-query (and transitively rowan) into the dep tree.
query = ["cst", "dep:aozora-query"]

[dev-dependencies]
# Used by `tests/corpus_sweep.rs` to walk `AOZORA_CORPUS_ROOT` and
# verify parse + round-trip invariants on every document. Declared
# path-only (no version) on purpose: aozora-corpus is a dev-only
# corpus loader that stays `publish = false`, so cargo must STRIP this
# dev-dependency from the published manifest. A versioned dev-dep
# would make crates.io require aozora-corpus to exist on the registry
# and would fail the `aozora` publish.
aozora-corpus = { path = "../aozora-corpus" }
proptest = { workspace = true }
aozora-proptest = { path = "../aozora-proptest" }

[package.metadata.cargo-shear]
# `proptest` is an intentional optional dependency exposed via the
# `proptest` feature (aozora::proptest::*) for downstream property tests.
# It also appears in dev-dependencies for this crate's own tests, so
# cargo-shear sees only the dev usage and flags the optional [dependencies]
# entry as misplaced — but the feature gate is the supported public surface.
ignored = ["proptest"]
