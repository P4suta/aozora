[package]
name = "aozora-pipeline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aozora = { path = "../.." }
aozora-ffi = { path = "../../../aozora-ffi" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_no_abort"
path = "fuzz_targets/ffi_no_abort.rs"
test = false
doc = false
bench = false
