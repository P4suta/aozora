[package]
name        = "aozora-cst"
description = "Lossless concrete syntax tree (CST) for the aozora parser — rowan-backed projection from BorrowedLexOutput. Internal crate; reach it via the aozora crate's `cst` feature."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[lints]
workspace = true

# Lower-level deps — depending on the public `aozora` meta crate
# would create a workspace cycle since `aozora` re-exports
# `aozora-cst` through its `cst` feature. Reaching for the spec /
# pipeline crates directly keeps the dep graph acyclic.
[dependencies]
aozora-pipeline = { workspace = true }
aozora-spec     = { workspace = true }
rowan           = { workspace = true }

[dev-dependencies]
aozora          = { path = "../aozora" }
aozora-proptest = { path = "../aozora-proptest" }
proptest        = { workspace = true }
