[package]
name = "aozora-ffi"
description = "C ABI driver for the aozora parser — opaque handle + JSON output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# Driver crate — never published to crates.io. Consumers link against
# the `cdylib` / `staticlib` artefacts produced by `cargo build` and
# include the generated C header at `include/aozora.h`.
publish = false

# NOTE: this crate intentionally does NOT inherit the workspace
# `unsafe_code = "forbid"` lint. The C ABI surface inherently
# requires unsafe blocks for `extern "C"`, raw pointer dereference,
# and `Box::into_raw` / `Box::from_raw`. We re-state the rest of the
# workspace's lint discipline locally so the FFI crate stays held to
# the same standard everywhere else.
[lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"

[dependencies]
# Drivers consume the wire format via `aozora::json::*`; serde +
# serde_json transitive-only via the `wire` feature.
aozora = { workspace = true, features = ["json"] }

[dev-dependencies]
# Golden-fixture loader for the cross-surface parity gate
# (`tests/fixture_parity.rs`). Path-only: aozora-conformance is a
# dev-only, `publish = false` crate. (aozora-ffi is itself
# `publish = false`, so this never reaches a published manifest either.)
aozora-conformance = { path = "../aozora-conformance" }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
