[package]
name = "fuzz-report-control"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "crash"
path = "fuzz_targets/crash.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean"
path = "fuzz_targets/clean.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
