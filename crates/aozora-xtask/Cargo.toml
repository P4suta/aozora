[package]
name = "aozora-xtask"
description = "Developer-side tooling for the aozora workspace (samply profile wrappers, etc.). Runs on the host — does not go through the Docker dev image because perf_event_open and clock_gettime need direct kernel access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
aozora = { workspace = true, features = ["schema", "json"] }
aozora-corpus = { workspace = true }
aozora-encoding = { workspace = true }
# Direct deps on internal crates the corpus/render audits reach past the
# umbrella's curated surface: `aozora_pipeline::lexer::sanitize`,
# `aozora_render::AOZORA_CLASSES`, and `aozora_syntax::{degraded,lint}` +
# `NodeKind`/`RegionFormat`. All no-contract internal surfaces.
aozora-pipeline = { workspace = true }
aozora-render = { workspace = true }
aozora-syntax = { workspace = true }
aozora-trace = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# AST parsing for `xtask lint suppressions`: counts #[allow] lint pairs
# per crate by walking the real syntax tree, so `#[cfg(test)]` modules and
# `reason = "…"` clauses are handled structurally rather than by regex.
# "visit" for the Visit trait, "full" for item/expr coverage, "parsing"
# for `syn::parse_file`. Not in `[workspace.dependencies]` (no other crate
# needs it); already present in Cargo.lock transitively via the proc-macro
# derives, so this pins the same 2.x line without adding a new graph.
syn = { version = "2.0.117", features = ["full", "visit", "parsing"] }
toml = { workspace = true }
tree-sitter = "0.26"
tree-sitter-aozora = { workspace = true }
walkdir = { workspace = true }
zstd = { workspace = true }

# `posix_fadvise(POSIX_FADV_DONTNEED)` for `corpus uncache` is Linux-only
# (rustix's `fs` module is configured out on Windows and macOS lacks
# `Advice::DontNeed`), so the dependency is scoped to Linux targets — the
# workspace still compiles on the macOS/Windows cross-os lane.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }
