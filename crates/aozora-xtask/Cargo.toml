[package]
name = "aozora-xtask"
description = "Developer-side tooling for the native aozora workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
aozora = { workspace = true, features = [
  "schema",
  "json",
] }
aozora-corpus = { workspace = true }
aozora-trace = { workspace = true }
blake3 = { workspace = true }
memchr = { workspace = true }
num-traits = { workspace = true }
cbindgen = { version = "0.29", default-features = false }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tempfile = { workspace = true }
time = { version = "0.3.53", features = ["formatting", "parsing"] }
toml = { workspace = true }
tree-sitter = "0.26"
tree-sitter-aozora = { workspace = true }
walkdir = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }
