
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "aozora"
description = "Aozora Bunko notation (青空文庫記法) parser — Python bindings (PyO3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 OR MIT" }
authors = [{ name = "aozora contributors" }]
keywords = ["aozora", "aozora-bunko", "parser", "japanese", "ruby", "furigana", "shift-jis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Markup",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "mypy>=1.11", "maturin>=1.9,<2.0"]

[project.urls]
Homepage = "https://p4suta.github.io/aozora/"
Repository = "https://github.com/P4suta/aozora"
Issues = "https://github.com/P4suta/aozora/issues"
Changelog = "https://github.com/P4suta/aozora/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["extension-module"]
python-source = "python"
module-name = "aozora._aozora"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
