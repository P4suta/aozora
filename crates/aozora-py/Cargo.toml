[package]
name = "aozora-py"
description = "Python (PyO3) driver for the aozora parser — maturin / pip distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

publish = false

[lints]
workspace = true

[dependencies]
aozora = { workspace = true, features = ["json"] }

[dependencies.pyo3]
version = "0.29"
optional = true
features = ["extension-module", "abi3-py311"]

[features]
default = []
extension-module = ["dep:pyo3"]

[lib]
name = "_aozora"
crate-type = ["lib", "cdylib"]
