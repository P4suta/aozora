[package]
name        = "aozora-py"
description = "Python (PyO3) driver for the aozora parser — maturin / pip distribution"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
# Crate-local, PyPI-facing README (absolute links so it renders on the
# PyPI project page); the other crates inherit the workspace README.
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true

# Driver crate — built into a wheel via `maturin build -F
# extension-module`. Host (cargo workspace) builds skip the pyo3 dep
# unless the `extension-module` feature is enabled, so a plain
# `cargo build --workspace` (without Python dev headers) still
# succeeds.
publish     = false

[lints]
workspace = true

[dependencies]
# Driver consumes the wire format via `aozora::json::*`; serde +
# serde_json transitive-only via the `wire` feature. The previous
# layout reached into `aozora-wasm` for the JSON projection — that
# coupling is gone now that `aozora::json` is the single authority.
aozora = { workspace = true, features = ["json"] }

# pyo3 + python dev headers are not installed in the default dev
# environment; expose the actual Python binding behind an opt-in
# feature so a plain `cargo build --workspace` does not need to
# discover Python. Enable the feature when running `maturin develop`
# / `maturin build`.
#
# `abi3-py311` builds against CPython's stable ABI (the limited API)
# with a 3.11 floor: maturin emits ONE forward-compatible
# `cp311-abi3` wheel per platform that loads on 3.11, 3.12, 3.13,
# 3.14 and every future 3.x — no per-version build matrix. abi3 also
# lets pyo3's build script compile WITHOUT discovering a Python
# interpreter, so `cargo check -p aozora-py -F extension-module`
# works in the Python-less dev image. (Free-threaded `3.13t`/`3.14t`
# are NOT abi3-compatible — they need a separate non-abi3 build; see
# publish-pypi.yml.)
[dependencies.pyo3]
version = "0.29"
optional = true
features = ["extension-module", "abi3-py311"]

[features]
default = []
extension-module = ["dep:pyo3"]

[lib]
# Hyphenated crate name (`aozora-py`) is not a valid Python module
# name. The wheel ships a mixed layout (see pyproject.toml
# `python-source`): the pure-Python package `aozora` (the public
# `Document` + parsed helpers) wraps this compiled extension, which
# is nested as the PRIVATE submodule `aozora._aozora`. The lib
# name must therefore be `_aozora`, matching the `#[pymodule] fn
# _aozora(...)` entry in src/lib.rs and the pyproject
# `module-name = "aozora._aozora"`.
name       = "_aozora"
crate-type = ["lib", "cdylib"]
