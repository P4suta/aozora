[package]
name        = "aozora-scan"
description = "Safe trigger-byte scanner for the Aozora notation lexer (aho-corasick-backed). Internal crate; depend on the aozora umbrella crate instead."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

# The scanner used to carry the tree's only `unsafe` (hand-rolled SIMD
# Teddy kernels). It now delegates to `aho-corasick`, so the crate is
# fully `forbid(unsafe_code)` like every other.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
missing_debug_implementations = "warn"

[features]
default = ["std"]
# `std` pulls `aho-corasick`'s packed (SIMD) backend, which needs
# runtime CPU-feature detection, plus the `OnceLock` automaton cache.
# Without `std`, `scan_offsets_in` falls back to the safe `NaiveScanner`
# (no packed backend, no cache) — correct, just slower.
std = ["dep:aho-corasick", "aho-corasick/std", "aho-corasick/perf-literal"]

[dependencies]
aozora-spec  = { workspace = true }
aho-corasick = { workspace = true, optional = true }
bumpalo      = { workspace = true }

[dev-dependencies]
proptest        = { workspace = true }
aozora-proptest = { path = "../aozora-proptest" }
criterion       = { workspace = true }

[[bench]]
name    = "scanner_bakeoff"
harness = false
