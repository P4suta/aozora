[package]
name = "tree-sitter-aozora"
description = "A tree-sitter grammar for Aozora Bunko notation (青空文庫記法), used by the workspace's conformance harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tree-sitter", "aozora", "japanese", "grammar", "parsing"]
categories = ["parser-implementations", "text-editors"]
include = [
  "bindings/rust/**",
  "src/**",
  "build.rs",
  "grammar.js",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
tree-sitter = "0.27"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
