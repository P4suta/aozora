[package]
name = "tree-sitter-aozora"
description = "A tree-sitter grammar for Aozora Bunko notation (青空文庫記法), used by the workspace's conformance harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Published as a standalone, reusable tree-sitter grammar — the ecosystem
# convention is that every `tree-sitter-<lang>` crate lives on crates.io so
# editors and tooling can consume the grammar directly. Its only in-repo
# consumer is the conformance harness in `aozora-xtask` (dev-only), so the
# publish serves downstream reuse, not any path dependency. Metadata mirrors
# the other members (repository/homepage/authors) for a clean crates.io listing.
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tree-sitter", "aozora", "japanese", "grammar", "parsing"]
categories = ["parser-implementations", "text-editors"]
# Keep the published package small: ship only what the build needs (the grammar
# is committed as generated C, so no node toolchain is required downstream).
include = [
  "bindings/rust/**",
  "src/**",
  "build.rs",
  "grammar.js",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
tree-sitter = "0.26"

# parser.c is committed (generated from grammar.js); building needs only a C toolchain.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
