# lychee configuration for the aozora-book handbook.
#
# ONE config, TWO modes:
#
#   - GATE (deterministic, blocking): `just book-linkcheck` and the
#     `book` job in `.github/workflows/ci.yml` run lychee with
#     `--offline`. Only INTERNAL links (relative `.html` cross-references
#     + local assets) are checked — no network probe ever runs, so the
#     gate cannot flake. This is the merge-blocking check.
#   - AUDIT (informational, non-blocking): `just book-linkcheck-external`
#     and the weekly `.github/workflows/link-audit.yml` run lychee WITHOUT
#     `--offline`, so external URLs are probed too. A failure opens a
#     tracking issue rather than blocking a PR.
#
# Why split: external link checking is inherently non-deterministic (host
# outages, rate limits, UA gating). Retries / cache / accept-codes /
# excludes below soften that for the AUDIT, but no amount of softening
# makes a third-party host's uptime a sane PR gate. The keys below
# (retries, accept, exclude) therefore only matter in AUDIT mode; under
# `--offline` they are inert. The remaining design goal applies to AUDIT:
# be loose enough that one transient network glitch does not turn the
# audit into noise.

# --- output ------------------------------------------------------------
no_progress = true
verbose = "info"

# --- fragments ---------------------------------------------------------
# Check `#anchor` fragments, not just paths. Without this lychee resolves
# the file and stops, so a link to a heading that no longer exists reads
# as healthy. That blind spot shipped: `node-docs/ruby.md` pointed at
# `arch/arena.md#non-empty-content`, a heading that never existed, and
# `aozora explain ruby` printed it to end users.
#
# This belongs in the GATE (not just the AUDIT): fragments of LOCAL files
# resolve from the rendered HTML we just built, so the check stays
# offline and deterministic. `anchor-only` skips `#:~:text=` fragments,
# which the handbook does not use.
include_fragments = "anchor-only"

# --- concurrency / timing ---------------------------------------------
# 16 simultaneous requests: lychee defaults to a per-host throttle, so
# raising the global concurrency does not flood any single domain. The
# rendered handbook has ~750 unique URLs across ~20 distinct hosts;
# 16-way parallelism cuts wall time roughly 2× over the previous 8.
max_concurrency = 16

# Per-request timeout. The default 20 s lets the dragnet pull through
# slow upstreams (docs.rs etc.) without hanging indefinitely.
timeout = 20

# Retry transient failures (connection reset, DNS hiccup, 5xx) up to
# 5 times with backoff. The pyo3.rs failure that cost us a CI run was
# a TCP-level "Connection failed" bounce on a request that succeeded
# on three other pages in the same run — i.e. the host is reachable
# but the runner happened to lose the race once. 5 retries × 3 s
# closes that window.
max_retries = 5
retry_wait_time = 3

# Follow up to 5 redirects per URL. lychee defaults to 5, but pin it
# here so the policy is documented next to the "why we retry" notes.
max_redirects = 5

# --- request deduplication --------------------------------------------
# Same URL referenced from N pages = N independent requests by default,
# which both wastes wall-clock and multiplies the chance that *one* of
# them hits a transient network glitch (the actual root cause of the
# pyo3.rs CI failure: 3 successful requests, 1 failed, all to the same
# URL). Enabling the on-disk cache collapses N to 1 within a run, and
# also lets a re-run within `max_cache_age` skip already-checked URLs.
cache = true
max_cache_age = "1d"

# --- HTTP behaviour ----------------------------------------------------
# Pretend to be a real browser; some sites (pyo3.rs, certain CDN front
# pages) gate on User-Agent and respond 403 or hang for "unknown".
user_agent = "lychee/aozora-book"

# Accept HTTP 200..=299 (the default) plus 429 (rate-limited but
# reachable — counts as "the link works") and 999 (LinkedIn's
# anti-bot sentinel that lychee documents specifically).
accept = ["200..=299", "429", "999"]

# --- exclusions --------------------------------------------------------
# `book/404.html` is mdbook's auto-generated 404 page; it carries
# `/aozora/` site-root absolute links that only resolve under the live
# Pages deploy. Skip the file entirely rather than maintaining a URL
# allow-list.
exclude_path = ["book/404.html"]

# URL-level exclusions for chronically flaky external hosts. The
# tradeoff: we don't catch genuine 404s on these targets, but the
# alternative is a green-then-red-then-green oscillation that turns
# CI signal into noise. Re-evaluate if the host's reachability
# improves; until then, the link is documentation-only and a
# manual click during release review is the verification path.
#
# pyo3.rs: connection-reset bounces about 1-in-20 lychee runs even
# with max_retries=5 + 3s backoff + per-run cache. The host gates
# on certain User-Agent shapes and intermittently drops handshakes;
# excluding here while keeping max_retries high for every other host.
exclude = [
  "^https?://pyo3\\.rs(/|$)",

  # docs.rs renders the *latest published* version of a crate. The
  # handbook references APIs added in a release that's still
  # in-flight — every such page returns 404 until the tag is cut
  # and crates.io has indexed the new build (typically several
  # minutes after `cargo publish`). Excluding the `aozora*`
  # namespace skips the false negatives without losing coverage of
  # external references (`docs.rs/serde`, `docs.rs/rowan`, etc.).
  # Verification of our own rustdoc URLs happens in the
  # `release.yml` workflow once the publish step lands.
  "^https?://docs\\.rs/aozora",

  # README / source links into our own repo at `main` resolve only
  # *after* the PR that introduces them is merged. Pre-merge
  # lychee runs see them as 404 because the file genuinely doesn't
  # exist on `main` yet. We trust the link — it's a relative path
  # within the same repo — and skip the network probe.
  "^https?://github\\.com/[^/]+/aozora/(blob|edit|tree)/main/",

  # npmjs.com returns 403 to lychee's non-browser User-Agent on
  # package pages that resolve fine in a browser (same UA-gating
  # rationale as pyo3.rs above). The only npmjs.com link in the
  # handbook is the published `aozora-wasm` package.
  "^https?://(www\\.)?npmjs\\.com/",
]
