# Domain terms and encoding names are valid prose without code formatting.
doc-valid-idents = [
  "..",
  "CommonMark",
  "GFM",
  "GitHub",
  "Shift_JIS",
  "NFC",
  "BOM",
  "UTF-8",
  "UTF-16",
  "Aozora",
  "JIS",
]

too-many-arguments-threshold = 4

too-many-lines-threshold = 80

# Parser type nesting makes a lower complexity threshold noisy without improving readability.
type-complexity-threshold = 250

max-fn-params-bools = 1

enum-variant-name-threshold = 2
enum-variant-size-threshold = 256

# The public MSRV keeps incompatible_msrv effective against the development toolchain (ADR-0034).
msrv = "1.89.0"

# Test assertions use unwrap, expect, and panic to report failures directly.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The pre-1.0 API can change when needed to simplify its implementation.
avoid-breaking-exported-api = false

pass-by-value-size-limit = 128

disallowed-methods = [
  { path = "std::mem::forget", reason = "leaks destructors; use `ManuallyDrop` or explicit drop" },
  { path = "std::env::set_var", reason = "races with other threads; wire via Options instead" },
  { path = "std::env::remove_var", reason = "see std::env::set_var" },
  { path = "std::process::exit", reason = "bypasses destructors; use `ExitCode` / return from main" },
]

disallowed-types = [
  { path = "std::sync::RwLock", reason = "tokio / parking_lot preferred where available; raise an ADR to opt in" },
]
