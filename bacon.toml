# Bench-only dependencies are excluded to keep the edit-compile loop fast (ADR-0004).
default_job = "check"

[jobs.check]
command = [
  "cargo",
  "check",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--all-targets",
  "--color",
  "always",
]
need_stdout = false
watch = ["crates", "spec"]
on_change_strategy = "kill_then_restart"

[jobs.clippy]
command = [
  "cargo",
  "clippy",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--lib",
  "--bins",
  "--tests",
  "--all-features",
  "--color",
  "always",
  "--",
  "-D",
  "warnings",
]
need_stdout = false

[jobs.test]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--all-targets",
  "--color",
  "always",
]
need_stdout = true
analyzer = "nextest"
