# bacon configuration for aozora.
#
# Launch with `just watch` (or the `just watch-lint` / `just watch-test`
# convenience recipes) — bacon runs inside the dev container so every
# command goes through the Docker-only execution surface (CLAUDE.md);
# never invoke bacon on the host.
# Keybindings (built-in defaults):
#   c  clippy       t  test        d  doc           f  failing-only
#   q  quit         esc previous   Ctrl-J  list jobs
#
# Config reference: https://dystroy.org/bacon/config/

default_job = "check"

# Fast edit-compile loop. `cargo check` skips codegen so the feedback
# cycle stays under a second for most touches. Mirrors `just check`
# (aozora-bench excluded — its criterion dep tree is bench-only).
[jobs.check]
command = [
  "cargo",
  "check",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--all-targets",
  "--color",
  "always",
]
need_stdout = false
watch = ["crates", "spec", "grammars"]
on_change_strategy = "kill_then_restart"

# Matches `just clippy` — the `--lib --bins --tests` surface (example /
# bench targets are skipped for the build-time reason documented on the
# `clippy` recipe). `[workspace.lints]` in Cargo.toml is the single
# source of truth for which lints fire (ADR-0004), so the CLI surface
# stays at `-D warnings` and never re-enables a group.
[jobs.clippy]
command = [
  "cargo",
  "clippy",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--lib",
  "--bins",
  "--tests",
  "--all-features",
  "--color",
  "always",
  "--",
  "-D",
  "warnings",
]
need_stdout = false

# Full workspace test suite via nextest — bacon's nextest analyzer
# parses the output for inline failure navigation. Matches `just test`.
[jobs.test]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "aozora-bench",
  "--all-targets",
  "--color",
  "always",
]
need_stdout = true
analyzer = "nextest"
