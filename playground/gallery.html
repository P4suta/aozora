<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A strict Content-Security-Policy meta tag is injected here at
         build time only (see PROD_CSP in vite.config.ts): defense-in-depth
         over the renderer's escaping — the HTML preview is mounted via
         innerHTML, but the aozora renderer already entity-escapes all text and
         emits no <script>/on*=/external href. It is build-time-only because
         dev mode needs an HMR WebSocket that connect-src 'self' would block
         and a <meta> CSP cannot be relaxed per-environment. -->

    <title>記法ギャラリー — Aozora Playground</title>
    <meta
      name="description"
      content="青空文庫記法の主要ファミリを、実レンダラ出力で横書き・縦書きの両方に並べて確認できるギャラリー。"
    />

    <!-- Aozora pink (--accent) を OS UI / モバイルブラウザのアドレスバーに反映 -->
    <meta name="theme-color" content="#b8336a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16161b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aozora Playground" />
    <meta property="og:title" content="記法ギャラリー — Aozora Playground" />
    <meta
      property="og:description"
      content="青空文庫記法の主要ファミリを、実レンダラ出力で横書き・縦書きの両方に並べて確認できるギャラリー。"
    />
    <meta property="og:image" content="https://p4suta.github.io/aozora/playground/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="記法ギャラリー — Aozora Playground" />
    <meta property="og:url" content="https://p4suta.github.io/aozora/playground/gallery.html" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="記法ギャラリー — Aozora Playground" />
    <meta
      name="twitter:description"
      content="青空文庫記法の主要ファミリを横書き・縦書きの両方でプレビュー。Rust + WebAssembly。"
    />
    <meta name="twitter:image" content="https://p4suta.github.io/aozora/playground/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
