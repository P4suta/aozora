<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is injected at build time only — see vite.config.ts. In dev
         mode Vite needs HMR WebSockets which a strict CSP would block. -->

    <title>Aozora Playground — 青空文庫記法 リアルタイムパーサー</title>
    <meta
      name="description"
      content="青空文庫記法をブラウザでリアルタイムにパースして、HTML プレビュー・診断・ノード JSON を確認できるプレイグラウンド。"
    />

    <!-- Aozora pink (--accent) を OS UI / モバイルブラウザのアドレスバーに反映 -->
    <meta name="theme-color" content="#b8336a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16161b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aozora Playground" />
    <meta property="og:title" content="Aozora Playground — 青空文庫記法 リアルタイムパーサー" />
    <meta
      property="og:description"
      content="Rust + WebAssembly 製の高速パーサーで、青空文庫記法をブラウザ上でリアルタイムに HTML 化。エディタ機能・診断・縦書きプレビュー・性能プロファイル付き。"
    />
    <meta property="og:image" content="./favicon.svg" />
    <meta property="og:url" content="https://p4suta.github.io/aozora/playground/" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Aozora Playground" />
    <meta
      name="twitter:description"
      content="青空文庫記法をブラウザでリアルタイムにパースするプレイグラウンド。Rust + WebAssembly。"
    />
    <meta name="twitter:image" content="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
