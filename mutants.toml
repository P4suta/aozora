# cargo-mutants configuration — assertion-strength (mutation) testing.
#
# Mutation testing complements region coverage: coverage proves a line
# RAN, mutation testing proves a WRONG result would FAIL a test. See
# docs/adr/0031-mutation-testing-for-assertion-strength.md and the
# `just mutants` recipe. Key reference: https://mutants.rs/config-file.html
#
# Lives at the repository root (not the tool's default `.cargo/mutants.toml`)
# because `.gitignore` excludes `/.cargo/`; `just mutants` passes it via
# `--config`.

# Run the suite through cargo-nextest — the workspace's standard runner
# (`just test`, coverage, and the whole pre-push pipeline use it) — rather
# than plain `cargo test`.
test_tool = "nextest"

# The Rust build needs tracked source and fixtures, not ignored frontend
# dependencies or generated artefacts.
gitignore = true

# Kill a hung mutant at 5x the baseline test time, floored at 30s. A
# mutation that turns a bounded parser loop into an unbounded one would
# otherwise hang the run; 5x still clears the warm ~1.3s suite with a wide
# margin, and the floor absorbs cold-cache jitter.
timeout_multiplier = 5.0
minimum_test_timeout = 30.0

# Files cargo-mutants must not mutate.
#
# Generated language surfaces are checked in and verified by the type/schema
# drift gates, but cargo-mutants only parses Rust product source. The encoding
# tables are emitted into OUT_DIR, and the tree-sitter parser is generated C.
# Test code is skipped automatically, so no exclusion is needed for the
# proptest oracles either.
#
# What remains to exclude is non-product source:
#   - aozora-bench: performance benchmarks, not correctness assertions
#   - **/fuzz:      libFuzzer harnesses (separate crates; belt-and-suspenders)
#   - aozora-extism plugin exports: `plugin.rs` is the whole
#     `#[cfg(target_arch = "wasm32")]` plugin module. Its thin `#[plugin_fn]`
#     wrappers delegate to the host-testable `logic` module in the same crate.
#     On a host sweep it is cfg-dead, so its mutants are vacuous survivors. It
#     was split out precisely so this glob excludes only the wrappers while
#     `logic` remains in the sweep.
#
# Non-product crates and non-native bindings. The per-PR `mutants-in-diff`
# gate (ci.yml) mutates the changed lines across the WHOLE workspace, not a
# single `-p` crate, so without these globs a change to tooling — or to a
# binding whose product surface is cfg-dead on a host build — would be gated
# on vacuous mutants. Excluding them makes the invariant hold: a crate in the
# `mutants.yml` sweep matrix is exactly a mutation-tested product crate.
#   - aozora-wasm / aozora-py: the product surface is entirely
#     `#[cfg(target_arch = "wasm32")]` / `feature = "extension-module"`
#     gated, so a host / default build compiles it out and every mutant is
#     vacuous. Wire correctness is covered upstream by the `aozora::json`
#     sweep plus the `parity.mjs` (wasm) and pytest (py) cross-checks.
#   - aozora-xtask / -corpus / -conformance / -proptest / -trace: dev
#     tooling and test / audit / profiling harnesses, not shipped product.
#   - aozora-go / -book: the Go binding and the mdbook (both workspace-
#     excluded); tree-sitter-aozora: generated `parser.c` plus a thin
#     hand-written Rust binding.
exclude_globs = [
  "crates/aozora-bench/**",
  "**/fuzz/**",
  "crates/aozora-extism/src/plugin.rs",
  "crates/aozora-wasm/**",
  "crates/aozora-py/**",
  "crates/aozora-xtask/**",
  "crates/aozora-corpus/**",
  "crates/aozora-conformance/**",
  "crates/aozora-proptest/**",
  "crates/aozora-trace/**",
  "crates/aozora-go/**",
  "crates/tree-sitter-aozora/**",
]
