output:
  - meta
  - summary
  - success
  - failure
  - execution
  - execution_info
  - execution_out
  - skips
  - empty_summary

pre-commit:
  parallel: true
  skip: [rebase, merge]
  commands:
    fmt:
      glob: "*.{rs,toml}"
      run: just fmt
      stage_fixed: true
    clippy:
      glob: "*.{rs,toml}"
      run: just clippy
    typos:
      run: just typos
    playground-typecheck:
      glob: "playground/**/*.{ts,tsx,json}"
      run: just playground-typecheck
    vscode-typecheck:
      glob: "editors/vscode/**/*.{ts,json}"
      run: just vscode-typecheck

commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}

pre-push:
  parallel: false
  skip: [rebase]
  commands:
    signing-check:
      run: scripts/check-signed-commits.sh
      fail_text: Push refused because the outgoing range contains an unsigned commit.
    ci:
      run: just ci
      fail_text: Re-run the failing fixed CI suite shown above.
    corpus:
      run: if [ -n "${AOZORA_CORPUS_ROOT:-}" ]; then just ci-corpus; fi
      fail_text: Re-run `just ci-corpus` with AOZORA_CORPUS_ROOT configured.

post-merge:
  commands:
    deps-status:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: just deps-status 2>/dev/null || true
