# Exercise parser changes between release qualifications (ADR-0042).
name: fuzz

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    permissions:
      contents: read
      issues: write # Record confirmed inputs under docs/adr/fuzz-reports-require-reproducible-target-failures.md.
    name: soak (${{ matrix.crate }}/${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: pipeline, target: lex }
          - { crate: pipeline, target: ffi_no_abort }
          - { crate: render, target: render_html }
          - { crate: render, target: serialize_round_trip }
          - { crate: render, target: catalogue_normalization }
          - { crate: encoding, target: decode_sjis }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.21
          cache: true
          install_args: rust@1.99.1 rust@nightly-2026-07-15 just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: fuzz-${{ matrix.crate }}-${{ matrix.target }}

      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/aozora/fuzz/${{ matrix.crate }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-

      - name: Fuzz soak (600 s)
        id: fuzz
        continue-on-error: true
        env:
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
        run: cargo run --locked -p aozora-xtask -q -- fuzz soak "$CRATE" "$TARGET"

      - name: Upload retained fuzz evidence
        if: always() && steps.fuzz.outputs.artifact_directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ steps.fuzz.outputs.kind }}-${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ steps.fuzz.outputs.artifact_directory }}/
          retention-days: 7
          if-no-files-found: error

      - name: Open / update crash tracking issue
        if: steps.fuzz.outputs.crashed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="fuzz-crash"
          TITLE="Fuzz crash: ${CRATE}/${TARGET}"

          gh label create "$LABEL" -c B60205 \
            -d "A cargo-fuzz target crashed in the manual fuzz soak" 2>/dev/null || true

          existing=$(gh issue list --label "$LABEL" --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          {
            echo "The manual fuzz soak retained an input that reproduces in **\`${CRATE}/${TARGET}\`**."
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "The offending input is attached to that run as the \`fuzz-crash-${CRATE}-${TARGET}\` artifact."
            echo
            echo "Download and replay the crash, then fix the bug and promote the artifact by filename:"
            echo
            echo '```sh'
            echo "gh run download <run-id> -n fuzz-crash-${CRATE}-${TARGET} \\"
            echo "  -D crates/aozora/fuzz/${CRATE}/artifacts/${TARGET}"
            echo "just fuzz-triage ${CRATE} ${TARGET}"
            echo "# After fixing the bug, promote the artifact by filename."
            echo "just fuzz-promote ${CRATE} ${TARGET} <artifact-filename>"
            echo '```'
            echo
            echo "Promotion moves the input into \`crates/aozora/tests/fuzz_regressions/${CRATE}/${TARGET}/\`."
          } > issue-body.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" \
              --body "Still crashing on the $(date -u +%Y-%m-%d) soak. See ${RUN_URL}"
            echo "Updated issue #${existing}"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md
            echo "Opened a new tracking issue"
          fi

      - name: Require a completed fuzz result
        if: always() && steps.fuzz.outcome != 'success'
        run: |
          echo "::error::Fuzz verification failed or is incomplete; inspect the engine result and retained evidence."
          exit 1
