# Exercise parser changes between release qualifications (ADR-0042).
name: fuzz

on:
  schedule:
    - cron: "29 4 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  soak:
    name: soak (${{ matrix.crate }}/${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: pipeline, target: lex }
          - { crate: pipeline, target: ffi_no_abort }
          - { crate: render, target: render_html }
          - { crate: render, target: serialize_round_trip }
          - { crate: render, target: catalogue_normalization }
          - { crate: encoding, target: decode_sjis }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@nightly-2026-07-15 just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fuzz-${{ matrix.crate }}-${{ matrix.target }}

      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/aozora/fuzz/${{ matrix.crate }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-

      - name: Fuzz soak (600 s)
        id: fuzz
        env:
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          cd "crates/aozora/fuzz/${CRATE}"
          cargo +nightly-2026-07-15 fuzz run \
            --target x86_64-unknown-linux-gnu "${TARGET}" -- -max_total_time=600
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=fuzz crash::${CRATE}/${TARGET} crashed (cargo-fuzz exit ${code}) — see artifact + tracking issue"
          else
            echo "crashed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${CRATE}/${TARGET} soaked 600 s with no crash"
          fi

      - name: Upload crash artifacts
        if: steps.fuzz.outputs.crashed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: fuzz-crash-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/aozora/fuzz/${{ matrix.crate }}/artifacts/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Open / update crash tracking issue
        if: steps.fuzz.outputs.crashed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="fuzz-crash"
          TITLE="Fuzz crash: ${CRATE}/${TARGET}"

          gh label create "$LABEL" -c B60205 \
            -d "A cargo-fuzz target crashed in the scheduled fuzz soak" 2>/dev/null || true

          existing=$(gh issue list --label "$LABEL" --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          {
            echo "The weekly fuzz soak crashed **\`${CRATE}/${TARGET}\`**."
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "The offending input is attached to that run as the \`fuzz-crash-${CRATE}-${TARGET}\` artifact."
            echo
            echo "Download and replay the crash, then fix the bug and promote the artifact by filename:"
            echo
            echo '```sh'
            echo "gh run download <run-id> -n fuzz-crash-${CRATE}-${TARGET} \\"
            echo "  -D crates/aozora/fuzz/${CRATE}/artifacts/${TARGET}"
            echo "just fuzz-triage ${CRATE} ${TARGET}"
            echo "# After fixing the bug, promote the artifact by filename."
            echo "just fuzz-promote ${CRATE} ${TARGET} <artifact-filename>"
            echo '```'
            echo
            echo "Promotion moves the input into \`crates/aozora/tests/fuzz_regressions/${CRATE}/${TARGET}/\`."
          } > issue-body.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" \
              --body "Still crashing on the $(date -u +%Y-%m-%d) soak. See ${RUN_URL}"
            echo "Updated issue #${existing}"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md
            echo "Opened a new tracking issue"
          fi

      - name: Fail on crash
        if: steps.fuzz.outputs.crashed == 'true'
        run: |
          echo "::error title=fuzz crash::${{ matrix.crate }}/${{ matrix.target }} crashed — see the fuzz-crash tracking issue"
          exit 1
