name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit to deploy (dispatched by release-fan-in); empty for a manual dev-tip deploy"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect:
    name: detect release commit
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 2
      - id: detect
        uses: ./.github/actions/detect-release-commit
      - id: mode
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION_CHANGED: ${{ steps.detect.outputs.version-changed }}
        run: |
          set -euo pipefail
          # The dispatched release run owns deployment of the qualified playground (ADR-0051).
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$COMMIT" ]]; then
            mode=release
          elif [[ "$GITHUB_EVENT_NAME" == push && "$VERSION_CHANGED" == true ]]; then
            mode=skip
          else
            mode=dev
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build:
    name: build site
    needs: detect
    if: needs.detect.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODE: ${{ needs.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.21
          cache: true
          install_args: rust@1.99.1 bun node cargo:wasm-pack npm:binaryen just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: docs


      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --jobs 1

      - name: Build playground
        if: needs.detect.outputs.mode != 'release'
        run: just playground-build

      - name: Download qualified release artifacts
        if: needs.detect.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" qualified "$QUALIFIED_SHA"

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          mkdir -p site/api
          cp -r target/doc/. site/api/
          mkdir -p site/playground
          if [[ "$MODE" == release ]]; then
            cp -r qualified/playground/. site/playground/
          else
            cp -r playground/dist/. site/playground/
          fi
          cat > site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>aozora — rustdoc</title>
          <meta http-equiv="refresh" content="0; url=./aozora/index.html">
          <link rel="canonical" href="./aozora/index.html">
          <p>Redirecting to <a href="./aozora/index.html">aozora API reference</a>.</p>
          HTML
          # Crate homepage URLs land here, so direct visitors to the playground.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>aozora</title>
          <meta http-equiv="refresh" content="0; url=./playground/">
          <link rel="canonical" href="./playground/">
          <p>Redirecting to the <a href="./playground/">aozora playground</a>.</p>
          HTML
          # Disable Jekyll's exclusion of paths beginning with underscores.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        id: deployment
