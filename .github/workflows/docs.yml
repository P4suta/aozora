# Publish the aozora handbook + rustdoc + playground to GitHub Pages.
#
# aozora does not currently publish to crates.io, so docs.rs is not an
# option for the API reference. Instead we build rustdoc on the runner,
# build the mdbook handbook from `crates/aozora-book/`, build the
# Solid + Vite + WASM playground from `playground/`, layer them under
# `/aozora/`, and deploy the whole site to GitHub Pages.
#
# Layout produced:
#   https://p4suta.github.io/aozora/                ← mdbook handbook
#   https://p4suta.github.io/aozora/api/            ← rustdoc landing redirect
#   https://p4suta.github.io/aozora/api/aozora/     ← cargo doc landing for the top-level facade
#   https://p4suta.github.io/aozora/playground/     ← interactive Aozora notation playground
#
# Docs builds use the native runner toolchain rather than the dev
# Docker image, because the Pages deploy actions expect artefacts on
# the runner filesystem. mdbook is installed via the upstream
# `peaceiris/actions-mdbook` action; the mermaid preprocessor is
# installed manually since the action does not bundle preprocessors.
# `wasm-pack` is needed for the playground's WASM bundle and lands via
# the rustwasm installer script.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; queue the rest so we never
# partially overwrite the Pages bucket.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: docs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          # Pinned to the Dockerfile's BUN_VERSION so the Pages deploy and
          # the dev/CI containers resolve the same bun (was `latest`).
          bun-version: '1.3.14'

      - name: Install wasm-pack
        # Pinned action + version (was an unpinned `curl … | sh`) so the
        # auto-fetched wasm-bindgen-cli is deterministic. Mirrors the
        # sibling afm repo's docs workflow.
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          version: 'v0.15.0'

      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08  # v2.0.0
        with:
          mdbook-version: latest

      - name: Install mdbook-mermaid
        # Prebuilt binary via install-action (binstall-backed) instead of
        # a ~1-2 min `cargo install` source build on every Pages deploy.
        # mdbook-mermaid ships prebuilts — the same source the dev image's
        # `cargo binstall` uses (Dockerfile cargo-tools stage).
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6  # v2
        with:
          tool: mdbook-mermaid

      - name: Install mermaid assets into the book directory
        # Writes `mermaid.min.js` + `mermaid-init.js` next to `book.toml`
        # so the `additional-js = [...]` declaration in book.toml resolves.
        # Those files are .gitignored in the source tree (vendor JS that
        # the preprocessor regenerates), so CI has to install them on the
        # runner before `mdbook build` runs.
        run: mdbook-mermaid install crates/aozora-book

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        # `--jobs 1` serialises rustdoc: `cargo doc --workspace` otherwise
        # races concurrent rustdoc processes on the shared target/doc
        # output (static.files/, trait.impl/, search index), which fails
        # intermittently while documenting the umbrella `aozora` crate's
        # re-export pages. Matches the `just doc` recipe's fix.
        run: cargo doc --workspace --no-deps --document-private-items --jobs 1

      - name: Build mdbook handbook
        run: mdbook build crates/aozora-book

      - name: Build aozora-wasm
        run: wasm-pack build --target web --release crates/aozora-wasm

      - name: Build playground
        working-directory: playground
        run: |
          set -euo pipefail
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
          bun run build

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r crates/aozora-book/book/. site/
          mkdir -p site/api
          cp -r target/doc/. site/api/
          mkdir -p site/playground
          cp -r playground/dist/. site/playground/
          # /api/ landing redirects to the top-level facade crate's docs.
          cat > site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>aozora — rustdoc</title>
          <meta http-equiv="refresh" content="0; url=./aozora/index.html">
          <link rel="canonical" href="./aozora/index.html">
          <p>Redirecting to <a href="./aozora/index.html">aozora API reference</a>.</p>
          HTML
          # GitHub Pages otherwise runs Jekyll and hides paths like `_sources`.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        id: deployment
