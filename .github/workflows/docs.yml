# Publish the playground + rustdoc to GitHub Pages.
#
# docs.rs renders the API for each released version. This site carries
# what docs.rs cannot: the playground, and a rustdoc build of the
# development tip — ahead of whatever the latest crates.io release
# renders.
#
# Layout produced:
#   https://p4suta.github.io/aozora/                ← redirect to the playground
#   https://p4suta.github.io/aozora/api/            ← rustdoc landing redirect
#   https://p4suta.github.io/aozora/api/aozora/     ← cargo doc landing for the top-level facade
#   https://p4suta.github.io/aozora/playground/     ← interactive Aozora notation playground
#
# The handbook used to be the site root. It is gone: the notation lives
# in the specification (p4suta.github.io/aozora-notation-spec), the API
# in docs.rs, the CLI in `aozora --help`, and the runbooks in docs/.
#
# Docs builds use the native runner toolchain rather than the dev
# Docker image, because the Pages deploy actions expect artefacts on
# the runner filesystem. `wasm-pack` is needed for the playground's
# WASM bundle and lands via the rustwasm installer script.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; queue the rest so we never
# partially overwrite the Pages bucket.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect release commit
        id: release
        run: |
          set -euo pipefail
          release=false
          if [[ "$GITHUB_EVENT_NAME" == push ]] &&
              git diff HEAD^ -- Cargo.toml | grep -Eq '^[+-]version = '; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: docs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        if: steps.release.outputs.release != 'true'
        with:
          # Pinned to the Dockerfile's BUN_VERSION so the Pages deploy and
          # the dev/CI containers resolve the same bun (was `latest`).
          bun-version: '1.3.14'

      - name: Install wasm-pack
        if: steps.release.outputs.release != 'true'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9  # v2.84.0
        with:
          tool: wasm-pack@0.15.0


      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        # `--jobs 1` serialises rustdoc: `cargo doc --workspace` otherwise
        # races concurrent rustdoc processes on the shared target/doc
        # output (static.files/, trait.impl/, search index), which fails
        # intermittently while documenting the umbrella `aozora` crate's
        # re-export pages. Matches the `just doc` recipe's fix.
        run: cargo doc --workspace --no-deps --all-features --jobs 1

      - name: Build aozora-wasm
        if: steps.release.outputs.release != 'true'
        run: CARGO_PROFILE_RELEASE_OPT_LEVEL=z wasm-pack build --target web --release crates/aozora-wasm

      - name: Build playground
        if: steps.release.outputs.release != 'true'
        working-directory: playground
        run: |
          set -euo pipefail
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
          bun run build

      - name: Wait for qualified release artifacts
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 330); do
            state="$(gh run list \
              --workflow release-ready.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | [.status, (.conclusion // "")] | @tsv')"
            if [[ "$state" == $'completed\tsuccess' ]]; then
              scripts/download-release-ready-artifact.sh \
                "release-ready-$GITHUB_SHA" qualified
              exit 0
            fi
            if [[ "$state" == completed$'\t'* ]]; then
              echo "::error title=release-ready::release-ready finished with ${state#*$'\t'}"
              exit 1
            fi
            sleep 60
          done
          echo "::error title=release-ready::timed out waiting for this commit"
          exit 1

      - name: Assemble site
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p site
          mkdir -p site/api
          cp -r target/doc/. site/api/
          mkdir -p site/playground
          if [[ "$RELEASE" == true ]]; then
            cp -r qualified/playground/. site/playground/
          else
            cp -r playground/dist/. site/playground/
          fi
          # /api/ landing redirects to the top-level facade crate's docs.
          cat > site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>aozora — rustdoc</title>
          <meta http-equiv="refresh" content="0; url=./aozora/index.html">
          <link rel="canonical" href="./aozora/index.html">
          <p>Redirecting to <a href="./aozora/index.html">aozora API reference</a>.</p>
          HTML
          # The handbook used to be the site root. Without something here
          # the root 404s, and every published crate's `homepage` points at
          # it — so send visitors to the playground, the one thing on this
          # site you cannot get from docs.rs or the specification.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>aozora</title>
          <meta http-equiv="refresh" content="0; url=./playground/">
          <link rel="canonical" href="./playground/">
          <p>Redirecting to the <a href="./playground/">aozora playground</a>.</p>
          HTML
          # GitHub Pages otherwise runs Jekyll and hides paths like
          # `_sources`. Needed by rustdoc's static.files/ — not a handbook
          # leftover.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        id: deployment
