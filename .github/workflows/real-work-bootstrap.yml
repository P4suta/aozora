name: real-work baseline bootstrap

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Failed-closed release-ready run containing exact candidate artifacts
        required: true
        type: string
      commit:
        description: 40-character aozora commit used by that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: real-work-baseline-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/load-release-inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AOZORA_REAL_WORK_LAB_REPOSITORY }}
          ref: ${{ env.AOZORA_REAL_WORK_LAB_SHA }}
          path: lab
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aozora-candidate-${{ inputs.commit }}-linux
          path: lab/_inputs/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aozora-rights-corpus-${{ inputs.commit }}
          path: lab/_inputs/corpus
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 go
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Extract commit-bound release inputs
        working-directory: lab
        env:
          AOZORA_LAB_COMMIT: ${{ env.AOZORA_REAL_WORK_LAB_SHA }}
          AOZORA_COMMIT: ${{ inputs.commit }}
        run: >-
          cargo run --quiet --locked --bin xtask -- release prepare
          --corpus-archive _inputs/corpus/corpus.tar
          --candidate-archive _inputs/candidate/bundle.tar
      - name: Install lab dependencies
        working-directory: lab
        run: bun install --frozen-lockfile
      - name: Generate a review candidate from full seven-engine parity
        working-directory: lab
        run: >-
          cargo run --quiet --locked --bin xtask -- release bootstrap-diagnostics
          --engine all
          --out _inputs/diagnostics/diagnostics-baseline.json
      - name: Build the first reviewable static site
        working-directory: lab
        run: cargo run --quiet --locked --bin xtask -- release build
      - name: Pack review inputs without promoting them
        run: >-
          cargo run --locked -p aozora-xtask -- real-work baselines
          --diagnostics lab/_inputs/diagnostics/diagnostics-baseline.json
          --site lab/candidate-site
          --out-dir target/real-work-baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-work-baseline-review-${{ inputs.commit }}
          path: target/real-work-baseline
          retention-days: 90
          if-no-files-found: error
