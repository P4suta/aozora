# PyPI publish workflow for `aozora-py`.
#
# Ships ONE abi3 wheel per platform (pyo3 `abi3-py311`): a single
# `cp311-abi3` wheel loads on CPython 3.11, 3.12, 3.13, 3.14 and every
# future 3.x — no per-Python-version build matrix. Plus an sdist for
# source installs where no wheel matches.
#
# Publishing: a release-plz `v*` tag triggers a real upload automatically.
# Manual fallback (dry run by default):
#   gh workflow run publish-pypi.yml -f dry_run=false
#
# Future matrix growth (0.5.0+, via cibuildwheel): Linux aarch64,
# macOS universal2, and a SEPARATE free-threaded build — abi3 wheels
# cannot target `3.13t`/`3.14t` (the limited API is incompatible with
# `Py_GIL_DISABLED`), so free-threaded support needs its own non-abi3
# `cp31xt` wheels.

name: publish-pypi

on:
  # A release-plz `v*` tag fans out here automatically; workflow_dispatch
  # stays as a manual fallback (defaults to a dry run).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels + sdist + twine check; do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build-wheels:
    name: build abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Force bash on every runner: Windows defaults to PowerShell, which
    # breaks the `\` line-continuations and bash-style `dist/*` globbing.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Any 3.11+ interpreter can host the build; abi3-py311 fixes the
      # wheel's ABI floor regardless of which one maturin finds.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: pypi-${{ matrix.os }}

      - name: Install maturin + twine
        run: pip install --upgrade "maturin>=1.9,<2.0" twine

      - name: Build abi3 wheel
        # No `--interpreter` / per-version loop: with abi3-py311 maturin
        # emits a single `cp311-abi3` wheel, tagged at the lowest
        # compatible manylinux on Linux (a no-op flag on macOS / Windows).
        run: |
          maturin build --release --strip \
            --manifest-path crates/aozora-py/Cargo.toml \
            --out dist

      - name: Verify metadata with twine check
        run: twine check dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Install maturin + twine
        run: pip install --upgrade "maturin>=1.9,<2.0" twine

      - name: Build sdist
        # `aozora-py` path-depends on sibling workspace crates; maturin
        # vendors them into the sdist. If a future restructuring breaks
        # sdist resolution, fall back to wheels-only (drop this job and
        # the `needs: build-sdist` below) — the abi3 wheels already cover
        # every supported platform.
        run: maturin sdist --manifest-path crates/aozora-py/Cargo.toml --out dist

      - name: Verify metadata with twine check
        run: twine check dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish:
    name: upload to PyPI
    # Real upload on a `v*` tag push; manual dispatch only when dry_run=false.
    if: github.event_name == 'push' || inputs.dry_run == false
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Gated behind the `release` GitHub Environment: required-reviewer
    # approval + deployment branch/tag restriction. PyPI strongly
    # recommends scoping a trusted publisher to a dedicated environment,
    # so set the environment name to `release` in the PyPI publisher
    # settings to match. Ref:
    # https://docs.pypi.org/trusted-publishers/security-model/
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies via OIDC, no API token in
      # the secrets store. The PyPI project must opt in via its
      # "publisher" settings (a "pending publisher" works for the very
      # first upload of a new project). Until then, fall back by setting
      # `secrets.PYPI_TOKEN` and replacing the `id-token` permission with
      # `password: ${{ secrets.PYPI_TOKEN }}` on the publish step.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # All artifacts (wheel-<os> + sdist) merged into dist/.
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist
          skip-existing: true
