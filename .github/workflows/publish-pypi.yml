name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit SHA to retry"
        type: string
        required: true
      dry_run:
        description: "Verify qualified wheels and sdist without uploading"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --upgrade twine
      - name: Download qualified Python distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for os in ubuntu-latest macos-latest windows-2025; do
            scripts/download-release-ready-artifact.sh \
              "release-python-$QUALIFIED_SHA-$os" dist "$QUALIFIED_SHA"
          done
      - name: Verify immutable distribution identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'manifest-*.json' -type f | wc -l)" -eq 3
          version=
          for manifest in dist/manifest-*.json; do
            test "$(jq -er .commit "$manifest")" = "$QUALIFIED_SHA"
            candidate="$(jq -er .version "$manifest")"
            if [[ -z "$version" ]]; then
              version="$candidate"
            else
              test "$candidate" = "$version"
            fi
          done
          if [[ -n "$RELEASE_TAG" ]]; then
            test "v${version}" = "$RELEASE_TAG"
          fi
          twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-python
          path: dist
      - name: Resolve registry state
        id: registry
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)"
          test -n "$wheel"
          version="$(unzip -p "$wheel" '*/METADATA' |
            awk -F': ' '$1 == "Version" { print $2; exit }')"
          test -n "$version"
          if metadata="$(curl -fsS "https://pypi.org/pypi/aozora/${version}/json" 2>/dev/null)"; then
            local_count=0
            for package in dist/*; do
              test -f "$package"
              filename="$(basename "$package")"
              digest="$(sha256sum "$package" | awk '{ print $1 }')"
              test "$(jq -er --arg filename "$filename" \
                '.urls[] | select(.filename == $filename) | .digests.sha256' \
                <<<"$metadata")" = "$digest"
              local_count=$((local_count + 1))
            done
            test "$(jq -er '.urls | length' <<<"$metadata")" -eq "$local_count"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        if: steps.registry.outputs.publish == 'true'
        with:
          packages-dir: dist
