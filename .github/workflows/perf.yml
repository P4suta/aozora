# Instruction counts avoid wall-clock noise on shared runners (ADR-0054).
name: perf

on:
  schedule:
    - cron: "0 17 * * *" # Run after the day's commits typically land.
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev valgrind
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: scheduled-perf
      - name: Instruction-count perf gate
        run: just perf-gate
