# Instruction counts avoid wall-clock noise on shared runners (ADR-0054).
name: perf

on:
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev valgrind
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: scheduled-perf
      - name: Instruction-count perf gate
        run: just perf-gate
