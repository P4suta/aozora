# Instruction-count perf gate (G6).
#
# Runs `just perf-gate`, which drives fixed micro-benchmarks under
# Valgrind's Callgrind. Callgrind
# counts CPU *instructions* within the native CI measurement epoch instead of
# wall-clock, which is far too noisy on shared GitHub runners to gate on.
#
# The committed instruction ceilings make every ephemeral runner a regression
# check; any case exceeding its ceiling fails.
#
# Action SHAs are pinned; Dependabot bumps weekly.
name: perf

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST — after the day's commits typically land
  workflow_dispatch:

# A new nightly perf run supersedes an in-flight one.
concurrency:
  group: perf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev valgrind
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: scheduled-perf
      - name: Instruction-count perf gate
        run: just perf-gate
