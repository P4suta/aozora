# Instruction-count perf gate (G6).
#
# Runs `just perf-gate`, which drives fixed micro-benchmarks under
# Valgrind's Callgrind. Callgrind
# counts CPU *instructions* — deterministic across runs and machines —
# instead of wall-clock, which is far too noisy on shared GitHub runners to
# gate on.
#
# The committed instruction baseline makes every ephemeral runner a real
# regression check; a case exceeding its baseline by more than 10% fails.
#
# Runs inside the in-tree dev image, mirroring ci.yml's container jobs.
# Action SHAs are pinned; Dependabot bumps weekly.
name: perf

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST — after the day's commits typically land
  workflow_dispatch:

# A new nightly perf run supersedes an in-flight one.
concurrency:
  group: perf
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # anonymous GHCR read for the dev-image buildcache

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - name: Instruction-count perf gate
        run: just perf-gate
