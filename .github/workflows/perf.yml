# Instruction-count perf gate (G6).
#
# Runs `just perf-gate`, which drives the iai-callgrind micro-benchmarks
# (aozora-bench/benches/perf_gate) under Valgrind's Callgrind. Callgrind
# counts CPU *instructions* — deterministic across runs and machines —
# instead of wall-clock, which is far too noisy on shared GitHub runners to
# gate on.
#
# Why nightly (and not per-PR yet): each ephemeral runner starts with no
# saved baseline, so a single run only RECORDS the instruction counts (it
# cannot regress against a baseline it just created). This lane exists to
# collect that stability data — how much the counts vary run-to-run in the
# GHA environment — before promoting the gate to a per-PR blocker with a
# persisted/committed baseline. Until then, the authoritative fail signal is
# the LOCAL `just perf-gate` (self-baselining) run a developer does before
# pushing. The >10% Ir soft limit is already baked into the bench, so the
# gate fires automatically once a baseline is present.
#
# Runs inside the in-tree dev image (valgrind + a version-matched
# iai-callgrind-runner live there), mirroring ci.yml's container jobs.
# Action SHAs are pinned; Dependabot bumps weekly.
name: perf

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST — after the day's commits typically land
  workflow_dispatch:

# A new nightly perf run supersedes an in-flight one.
concurrency:
  group: perf
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # anonymous GHCR read for the dev-image buildcache

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-dev-image
      - name: Instruction-count perf gate
        run: just perf-gate
