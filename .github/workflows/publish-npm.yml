name: publish-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit SHA to retry"
        type: string
        required: true
      dry_run:
        description: "Verify the qualified package without uploading"
        type: boolean
        default: true
      use_oidc:
        description: "Use npm Trusted Publishing; disable only for first-package bootstrap"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: Download qualified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" qualified "$QUALIFIED_SHA"
      - name: Verify immutable package identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(jq -er .commit qualified/manifest.json)" = "$QUALIFIED_SHA"
          mapfile -t packages < <(find qualified -maxdepth 1 -name '*.tgz' -type f)
          test "${#packages[@]}" -eq 1
          package_version="$(tar -xOf "${packages[0]}" package/package.json | jq -er .version)"
          test "$package_version" = "$(jq -er .version qualified/manifest.json)"
          if [[ -n "$RELEASE_TAG" ]]; then
            test "v${package_version}" = "$RELEASE_TAG"
          fi
          mkdir -p npm-dist
          cp "${packages[0]}" npm-dist/
          # Offline publishability lint (no registry round-trip). `npm publish
          # --dry-run` queries the registry and exits non-zero once this version
          # is already published, which would break idempotent re-runs before the
          # publish job's own `npm view` guard can decide. Validate the tarball
          # locally instead: it must carry the public name, must not be private,
          # and must actually contain its declared `main` entry.
          package_json="$(tar -xOf npm-dist/*.tgz package/package.json)"
          test "$(jq -er .name <<<"$package_json")" = aozora-wasm
          jq -e '.private != true' <<<"$package_json" >/dev/null
          main="$(jq -er .main <<<"$package_json")"
          # List members into a variable first: `tar … | grep -Fxq` makes grep
          # exit on the first match and close the pipe, so tar takes SIGPIPE and
          # the step's `set -o pipefail` fails it. A here-string has no pipe.
          members="$(tar -tzf npm-dist/*.tgz)"
          grep -Fxq "package/$main" <<<"$members"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-npm
          path: npm-dist/*.tgz
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-npm
          path: pkg
      - run: npm install -g npm@latest
      - name: Resolve registry state
        id: registry
        run: |
          set -euo pipefail
          package="$(find pkg -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$package"
          name="$(tar -xOf "$package" package/package.json | jq -er .name)"
          version="$(tar -xOf "$package" package/package.json | jq -er .version)"
          # shellcheck disable=SC2016
          integrity="$(PACKAGE="$package" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            process.stdout.write(`sha512-${createHash("sha512")
              .update(readFileSync(process.env.PACKAGE)).digest("base64")}`);
          ')"
          if remote="$(npm view "${name}@${version}" dist.integrity 2>/dev/null)"; then
            test "$remote" = "$integrity"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm Trusted Publishing
        if: ${{ steps.registry.outputs.publish == 'true' && (github.event_name == 'push' || inputs.use_oidc) }}
        run: npm publish ./pkg/*.tgz --access public
      - name: Bootstrap first publish with token
        if: ${{ steps.registry.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && !inputs.use_oidc }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./pkg/*.tgz --access public --provenance
