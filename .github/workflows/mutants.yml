name: mutants

on:
  schedule:
    - cron: "13 6 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  sweep:
    name: sweep (${{ matrix.assignment }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        assignment:
          - "aozora:0/16"
          - "aozora:1/16"
          - "aozora:2/16"
          - "aozora:3/16"
          - "aozora:4/16"
          - "aozora:5/16"
          - "aozora:6/16"
          - "aozora:7/16"
          - "aozora:8/16"
          - "aozora:9/16"
          - "aozora:10/16"
          - "aozora:11/16"
          - "aozora:12/16"
          - "aozora:13/16"
          - "aozora:14/16"
          - "aozora:15/16"
          - "aozora-cli:0/12"
          - "aozora-cli:1/12"
          - "aozora-cli:2/12"
          - "aozora-cli:3/12"
          - "aozora-cli:4/12"
          - "aozora-cli:5/12"
          - "aozora-cli:6/12"
          - "aozora-cli:7/12"
          - "aozora-cli:8/12"
          - "aozora-cli:9/12"
          - "aozora-cli:10/12"
          - "aozora-cli:11/12"
          - "aozora-ffi:0/1"
          - "aozora-extism:0/1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dev-image

      - name: Mutation sweep
        id: sweep
        env:
          ASSIGNMENT: ${{ matrix.assignment }}
        run: |
          CRATE="${ASSIGNMENT%%:*}"
          SHARD="${ASSIGNMENT#*:}"
          set +e
          just mutants -p "$CRATE" --all-features \
            --shard "$SHARD" --sharding round-robin
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Require zero viable survivors and timeouts
        env:
          ASSIGNMENT: ${{ matrix.assignment }}
          SWEEP_EXIT: ${{ steps.sweep.outputs.exit }}
        run: |
          set -euo pipefail
          CRATE="${ASSIGNMENT%%:*}"
          report=mutants.out/outcomes.json
          test -s "$report"
          total=$(jq -er '.total_mutants' "$report")
          missed=$(jq -er '.missed' "$report")
          timeout=$(jq -er '.timeout' "$report")
          test "$total" -gt 0
          if [ "$SWEEP_EXIT" -ne 0 ] || [ "$missed" -ne 0 ] || [ "$timeout" -ne 0 ]; then
            echo "::error title=mutation sweep::${CRATE}: exit=${SWEEP_EXIT}, missed=${missed}, timeout=${timeout}"
            exit 1
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants.out/
          retention-days: 30
          if-no-files-found: error
