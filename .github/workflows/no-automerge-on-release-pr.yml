name: no-automerge-on-release-pr

on:
  pull_request_target:
    types: [auto_merge_enabled]

permissions:
  contents: read

jobs:
  disable:
    if: startsWith(github.event.pull_request.head.ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Disable auto-merge on the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto-merge
          gh pr comment "$PR" --repo "$REPO" --body \
            "🔒 Auto-merge was disabled automatically: a release is a deliberate act. Add the \`release: approved\` label and squash-merge this PR by hand."
