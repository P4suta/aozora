# crates.io rejects workflow_run OIDC, so dispatch the publisher instead (ADR-0051).

name: release-fan-in

on:
  workflow_run:
    workflows: [release-ready]
    types: [completed]

concurrency:
  group: release-fan-in-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read # Check out the qualified commit.
  actions: write # Dispatch the publisher and docs workflows.

jobs:
  fan-in:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: detect
        uses: ./.github/actions/detect-release-commit
      - name: Dispatch release + docs for a qualified release commit
        if: steps.detect.outputs.version-changed == 'true'
        run: |
          set -euo pipefail
          gh workflow run release-plz.yml --ref main -f commit="$QUALIFIED_SHA"
          gh workflow run docs.yml --ref main -f commit="$QUALIFIED_SHA"
