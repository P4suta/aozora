name: release-vscode

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit SHA to retry"
        type: string
        required: true
      tag:
        description: "Release tag matching the qualified version"
        type: string
        required: true
      dry_run:
        description: "Verify qualified VSIX files without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
      - name: Download qualified VSIX distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for target in \
            linux-x64 linux-arm64 alpine-x64 alpine-arm64 \
            darwin-x64 darwin-arm64 win32-x64 win32-arm64
          do
            scripts/download-release-ready-artifact.sh \
              "release-vsix-$QUALIFIED_SHA-$target" vsix "$QUALIFIED_SHA"
          done
      - name: Verify immutable extension identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"
          test "$(find vsix -maxdepth 1 -name '*.vsix' -type f | wc -l)" -eq 8
          test "$(find vsix -maxdepth 1 -name 'manifest-*.json' -type f | wc -l)" -eq 8
          version=
          for manifest in vsix/manifest-*.json; do
            test "$(jq -er .commit "$manifest")" = "$QUALIFIED_SHA"
            candidate="$(jq -er .version "$manifest")"
            if [[ -z "$version" ]]; then
              version="$candidate"
            else
              test "$candidate" = "$version"
            fi
          done
          test "v${version}" = "$RELEASE_TAG"
          for package in vsix/*.vsix; do
            test "$(unzip -p "$package" extension/package.json | jq -er .version)" = "$version"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-vsix
          path: vsix/*.vsix
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-vsix
          path: vsix
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "vsix/*.vsix"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install pinned registry clients
        working-directory: editors/vscode
        run: bun install --frozen-lockfile
      - name: Require both registry credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          test -n "$VSCE_PAT"
          test -n "$OVSX_PAT"
      - name: Publish to VS Code Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for package in ../../vsix/*.vsix; do
            bun run vsce publish --packagePath "$package" \
              --pat "$VSCE_PAT" --skip-duplicate
          done
      - name: Publish to Open VSX
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for package in ../../vsix/*.vsix; do
            bun run ovsx publish "$package" -p "$OVSX_PAT" --skip-duplicate
          done
