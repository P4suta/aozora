# VS Code extension release workflow.
#
# Cross-compiles `aozora-lsp` to all platforms VS Code supports as
# extension targets, packages one platform-specific `.vsix` per target
# with the binary bundled at `editors/vscode/server/aozora-lsp(.exe)`,
# and on a `vscode-v*` tag publishes every `.vsix` to both the VS Code
# Marketplace and Open VSX. Marketplace fans the right platform out
# automatically based on the user's editor at install time, so the
# end-user install experience is "one click → it just works".
#
# Trigger: push of `vscode-v<semver>` tags (publishes), or manual
# `workflow_dispatch` (builds artefacts only — no publish).

name: release-vscode

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build ${{ matrix.vsce_target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu ----------------------------------------------------
          - vsce_target: linux-x64
            cargo_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - vsce_target: linux-arm64
            cargo_target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          # Linux musl (Alpine, distroless, scratch images) -------------
          - vsce_target: alpine-x64
            cargo_target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - vsce_target: alpine-arm64
            cargo_target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          # macOS -------------------------------------------------------
          # `macos-latest` is arm64 native (macos-14+); cross-compiling
          # to x86_64-apple-darwin only needs `rustup target add`, the
          # Apple-supplied clang handles the SDK switch automatically.
          - vsce_target: darwin-x64
            cargo_target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - vsce_target: darwin-arm64
            cargo_target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          # Windows -----------------------------------------------------
          - vsce_target: win32-x64
            cargo_target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
          - vsce_target: win32-arm64
            cargo_target: aarch64-pc-windows-msvc
            runner: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Read Rust toolchain version
        id: toolchain
        shell: bash
        run: |
          version=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.cargo_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          # Per-target cache, keyed off the VS Code-facing target name
          # so cache restoration is unambiguous across the matrix.
          shared-key: vscode-${{ matrix.vsce_target }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      # `cross` (Docker-based) is the cleanest path for Linux cross-
      # compile targets: it brings its own glibc/musl sysroots so we
      # don't need to apt-install per-target gcc cross packages.
      - name: Install `cross`
        if: matrix.cross
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cross

      # Stamp the bundled server's `--version`. Without this, `.git` is
      # present (actions/checkout leaves it) so aozora-buildstamp's build.rs
      # takes it for a working tree and stamps `-dev+g<sha>` — a shipped
      # binary calling itself a dev build, the exact inversion of what that
      # stamp is for. The value is the crate's, not the tag's: the extension
      # rides its own Marketplace version line (ADR-0016), so `vscode-v0.1.0`
      # says nothing about which aozora-lsp is inside.
      - name: Resolve build-version stamp
        shell: bash
        run: |
          set -euo pipefail
          echo "AOZORA_BUILD_VERSION=$(cargo run -p aozora-xtask -q -- version --channel stable)" >> "$GITHUB_ENV"

      - name: Build aozora-lsp (dist profile)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --locked --profile dist --target ${{ matrix.cargo_target }} --bin aozora-lsp
          else
            cargo build --locked --profile dist --target ${{ matrix.cargo_target }} --bin aozora-lsp
          fi

      - name: Stage binary into editors/vscode/server/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editors/vscode/server
          # Bind the matrix value to a shell var before use: keeps the GHA
          # expression out of the `[[ … ]]` test (shellcheck SC2193 false
          # positive on a templated literal) and out of direct interpolation.
          target="${{ matrix.cargo_target }}"
          src="target/${target}/dist/aozora-lsp"
          dst="editors/vscode/server/aozora-lsp"
          if [[ "${target}" == *-windows-* ]]; then
            cp "${src}.exe" "${dst}.exe"
          else
            cp "${src}" "${dst}"
            chmod 0755 "${dst}"
          fi
          ls -la editors/vscode/server/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install + compile extension
        working-directory: editors/vscode
        run: |
          bun install --frozen-lockfile
          bun run compile

      - name: Package platform-specific .vsix
        working-directory: editors/vscode
        run: bun run vsce package --target ${{ matrix.vsce_target }} --no-yarn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: editors/vscode/*.vsix
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish to Marketplace + Open VSX
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-latest
    # Gated behind the `release` GitHub Environment. VSCE_PAT / OVSX_PAT
    # are Environment secrets (not repo secrets), so they are unreachable
    # until a required reviewer approves — a pushed `vscode-v*` tag no
    # longer publishes to the Marketplace without human approval. The
    # `build` matrix runs ungated (no secrets); `workflow_dispatch` only
    # builds artefacts (this job is skipped).
    environment: release
    permissions:
      contents: read
      id-token: write # provenance attestation (Sigstore OIDC)
      attestations: write # record the attestation against the repo
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix

      - name: List artefacts
        run: ls -la vsix/

      # SLSA-style provenance for each .vsix before it ships to the
      # Marketplace / Open VSX. Verify with
      # `gh attestation verify <file> --repo P4suta/aozora`.
      - name: Attest VSIX provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "vsix/*.vsix"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      # `vsce` and `ovsx` are devDependencies, so the lockfile pins the tools
      # that talk to the registries. Resolving them fresh (`bunx`) would let
      # whatever npm serves at publish time sign and upload the release.
      - name: Install publish tooling
        working-directory: editors/vscode
        run: bun install --frozen-lockfile

      - name: Publish to VS Code Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "::error::VSCE_PAT secret is not set; cannot publish to Marketplace"
            exit 1
          fi
          for vsix in ../../vsix/*.vsix; do
            echo "::group::Publishing ${vsix}"
            bun run vsce publish --packagePath "${vsix}" --pat "${VSCE_PAT}"
            echo "::endgroup::"
          done

      # Open VSX is opt-in: it serves the VSCodium / Cursor / Theia crowd and
      # the Marketplace is the primary surface, so an unset OVSX_PAT skips the
      # step. Once it is set, a failure is a failure — swallowing it into a
      # `::warning::` bought a green tick for a release that did not ship.
      - name: Publish to Open VSX
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: |
          set -euo pipefail
          for vsix in ../../vsix/*.vsix; do
            echo "::group::Publishing ${vsix} to Open VSX"
            bun run ovsx publish "${vsix}" -p "${OVSX_PAT}"
            echo "::endgroup::"
          done
