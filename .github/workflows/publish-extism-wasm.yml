name: publish-extism-wasm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit SHA to retry"
        type: string
        required: true
      tag:
        description: "Existing vX.Y.Z draft GitHub Release tag"
        type: string
        required: true
      dry_run:
        description: "Verify the qualified wasm without uploading"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-extism-wasm
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
      - name: Download qualified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" qualified "$QUALIFIED_SHA"
      - name: Verify immutable wasm identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"
          test "$(jq -er .commit qualified/manifest.json)" = "$QUALIFIED_SHA"
          version="$(jq -er .version qualified/manifest.json)"
          test "v${version}" = "$RELEASE_TAG"
          (cd qualified && sha256sum --check SHA256SUMS)
          test -s qualified/aozora.wasm
          test -s qualified/aozora-extism.cdx.json
          mkdir -p dist
          cp qualified/aozora.wasm qualified/aozora-extism.cdx.json dist/
          (
            cd dist
            sha256sum aozora.wasm > aozora.wasm.sha256
            sha256sum aozora-extism.cdx.json > aozora-extism.cdx.json.sha256
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-extism-wasm
          path: dist
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-extism-wasm
          path: dist
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/aozora.wasm
            dist/aozora-extism.cdx.json
      - name: Upload exact wasm to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq "[.[] | select(.tag_name == \"${RELEASE_TAG}\")][0].draft" 2>/dev/null || true)"
            if [[ -n "$is_draft" && "$is_draft" != null ]]; then
              if [[ "$is_draft" != true ]]; then
                echo "::error title=release::release $RELEASE_TAG is already published and immutable" >&2
                exit 1
              fi
              gh release upload "$RELEASE_TAG" \
                dist/aozora.wasm dist/aozora.wasm.sha256 \
                dist/aozora-extism.cdx.json \
                dist/aozora-extism.cdx.json.sha256 --clobber
              exit 0
            fi
            echo "Release $RELEASE_TAG is not available yet ($attempt/30)"
            sleep 20
          done
          echo "::error title=release::release $RELEASE_TAG did not appear" >&2
          exit 1
