# Publish workflow for the portable Extism plugin `aozora.wasm`.
#
# The whole point of the Extism strategy (ADR-0006): ONE portable wasm
# artifact serves every language's host SDK — there is no per-(OS × arch)
# native build matrix. This workflow builds that single artifact, shrinks
# it with wasm-opt, and attaches it (plus a SHA-256 checksum and a SLSA
# build-provenance attestation) to a GitHub Release. Every host SDK
# (Go / Ruby / …) embeds or downloads these exact bytes; the attestation
# lets them verify the provenance with `gh attestation verify`.
#
# Manual trigger only; defaults to a dry run (build + checksum, no upload).
# The `build` job runs ungated; the live `publish` job runs in the
# `release` GitHub Environment (required-reviewer approval) before any
# release asset is uploaded.
#
# Publishing: a release-plz `v*` tag fans out here and attaches aozora.wasm to
# the GitHub Release that release.yml cuts from the same tag (this job waits for
# that Release to exist). Manual fallback (attach to an existing release tag):
#   gh workflow run publish-extism-wasm.yml -f tag=v0.4.1 -f dry_run=false
#   # then approve the `publish` job in the release environment.

name: publish-extism-wasm

on:
  # A release-plz `v*` tag fans out here automatically; workflow_dispatch
  # stays as a manual fallback (defaults to a dry run).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach aozora.wasm to (e.g. v0.4.1); ignored on a tag push"
        type: string
        required: false
      dry_run:
        description: "Build + checksum only; skip the release upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-extism-wasm
  cancel-in-progress: false

env:
  # Keep in lock-step with the Dockerfile's BINARYEN_VERSION so the
  # published artifact is byte-reproducible with `just extism-build`.
  BINARYEN_VERSION: "130"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: publish-extism-wasm

      - name: Install binaryen (wasm-opt)
        run: |
          curl -L --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /opt
          echo "/opt/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build aozora.wasm
        run: cargo build --release --target wasm32-unknown-unknown -p aozora-extism

      - name: Optimize + stage artifact
        run: |
          mkdir -p dist
          wasm-opt -O3 --enable-bulk-memory --enable-mutable-globals \
            target/wasm32-unknown-unknown/release/aozora_extism.wasm \
            -o dist/aozora.wasm
          ( cd dist && sha256sum aozora.wasm > aozora.wasm.sha256 )
          ls -l dist
          cat dist/aozora.wasm.sha256

      - name: Upload build artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aozora-wasm-extism
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    # Real upload on a `v*` tag push; manual dispatch only when dry_run=false.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload release assets
      id-token: write # mint the OIDC token for build provenance
      attestations: write # record the SLSA provenance attestation
    steps:
      - name: Download build artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aozora-wasm-extism
          path: dist

      - name: Attest build provenance
        # Same pinned action as release.yml / release-vscode.yml — keep the SHA in lock-step.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/aozora.wasm

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # On a tag push the tag is the ref; on dispatch it's the input.
          # Bound to env (not interpolated into the script) to keep the tag
          # name out of the shell text.
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # release.yml creates the GitHub Release from this same `v*` tag; both
          # workflows fire on the tag with no ordering guarantee, so wait for the
          # Release to exist before attaching the portable wasm to it.
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG not present yet; waiting ($i/30)…"
            sleep 20
          done
          gh release upload "$TAG" dist/aozora.wasm dist/aozora.wasm.sha256 --clobber
