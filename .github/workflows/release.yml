name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified release commit SHA to retry"
        type: string
        required: true
      tag:
        description: "Release tag matching the qualified version"
        type: string
        required: true
      dry_run:
        description: "Verify qualified native distributions without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
      - name: Download qualified native distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            scripts/download-release-ready-artifact.sh \
              "release-native-$QUALIFIED_SHA-$target" artefacts "$QUALIFIED_SHA"
          done
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" combined "$QUALIFIED_SHA"
          test "$(jq -er .commit combined/manifest.json)" = "$QUALIFIED_SHA"
          test "v$(jq -er .version combined/manifest.json)" = "$RELEASE_TAG"
          (cd combined && sha256sum --check SHA256SUMS)
          cp combined/aozora-go.tar.gz combined/aozora-go.cdx.json artefacts/
          (
            cd artefacts
            sha256sum aozora-go.tar.gz > aozora-go.tar.gz.sha256
            sha256sum aozora-go.cdx.json > aozora-go.cdx.json.sha256
          )
      - name: Verify immutable native identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"
          version="${RELEASE_TAG#v}"
          expected=(
            "aozora-v${version}-x86_64-unknown-linux-gnu.tar.gz"
            "aozora-v${version}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "aozora-v${version}-x86_64-unknown-linux-gnu-cli.cdx.json"
            "aozora-v${version}-x86_64-unknown-linux-gnu-ffi.cdx.json"
            "aozora-v${version}-aarch64-apple-darwin.tar.gz"
            "aozora-v${version}-aarch64-apple-darwin.tar.gz.sha256"
            "aozora-v${version}-aarch64-apple-darwin-cli.cdx.json"
            "aozora-v${version}-aarch64-apple-darwin-ffi.cdx.json"
            "aozora-v${version}-x86_64-pc-windows-msvc.zip"
            "aozora-v${version}-x86_64-pc-windows-msvc.zip.sha256"
            "aozora-v${version}-x86_64-pc-windows-msvc-cli.cdx.json"
            "aozora-v${version}-x86_64-pc-windows-msvc-ffi.cdx.json"
            aozora-go.tar.gz
            aozora-go.tar.gz.sha256
            aozora-go.cdx.json
            aozora-go.cdx.json.sha256
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(find artefacts -maxdepth 1 -type f -printf '%f\n' | sort)
          (cd artefacts && sha256sum --check ./*.sha256)

          archive_version=
          while IFS= read -r archive; do
            case "$archive" in
              *.zip) manifest="$(unzip -p "$archive" '*/manifest.json')" ;;
              *) manifest="$(tar -xOf "$archive" --wildcards '*/manifest.json')" ;;
            esac
            test "$(jq -er .commit <<<"$manifest")" = "$QUALIFIED_SHA"
            candidate="$(jq -er .version <<<"$manifest")"
            if [[ -z "$archive_version" ]]; then
              archive_version="$candidate"
            else
              test "$candidate" = "$archive_version"
            fi
          done < <(find artefacts -maxdepth 1 -type f \
            \( -name 'aozora-v*.tar.gz' -o -name 'aozora-v*.zip' \) | sort)
          test "$archive_version" = "$version"
      - name: Aggregate checksums
        run: |
          cd artefacts
          sha256sum aozora-*.tar.gz aozora-*.zip aozora-*.cdx.json |
            sort > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-native
          path: artefacts
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-native
          path: artefacts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artefacts/aozora-*.tar.gz
            artefacts/aozora-*.zip
            artefacts/aozora-*.cdx.json
      - name: Extract release notes
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { emit = 1; next }
            emit && /^## \[/ { exit }
            emit { print }
          ' CHANGELOG.md > CHANGES.md
          test -s CHANGES.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.QUALIFIED_SHA }}
          files: |
            artefacts/aozora-*.tar.gz
            artefacts/aozora-*.zip
            artefacts/aozora-*.cdx.json
            artefacts/*.sha256
            artefacts/SHA256SUMS
          body_path: CHANGES.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
