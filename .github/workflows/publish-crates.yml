# cargo publish workflow for the aozora workspace.
#
# Publishes every publishable crate to crates.io in dependency
# (topological) order: dependency-free leaves first, `aozora-cli` last.
# Each `cargo publish` waits for its crate to appear in the crates.io
# index before returning (cargo >= 1.66), so the next crate's
# dependency resolution finds the version that was just uploaded — no
# manual `sleep` between steps.
#
# Why an explicit ladder and NOT `cargo publish --workspace`:
#   `cargo publish --workspace` (and its `--dry-run`) was evaluated on
#   the pinned toolchain (cargo 1.96.0) and does NOT order interdependent
#   members topologically on a first publish — it tries to package
#   `aozora-render` before `aozora-pipeline` and aborts with "no matching
#   package named aozora-pipeline found". The explicit ladder below is
#   deterministic and verifiable; revisit `--workspace` once the toolchain
#   handles first-publish ordering reliably. (See cargo-release #691.)
#
# Members marked `publish = false` (aozora-corpus, aozora-conformance,
# aozora-bench, aozora-trace, aozora-xtask, and the aozora-wasm /
# aozora-ffi / aozora-py drivers that ship through npm / GitHub Releases
# / PyPI) are intentionally absent from the list.
#
# Live publish is `dry_run: false`, manual trigger only. Default
# `dry_run: true` so a stray `Run workflow` click cannot accidentally
# push to crates.io.
#
# How to run a real publish:
#   gh workflow run publish-crates.yml -f dry_run=false
# (also requires the `CARGO_TOKEN` repo secret populated with a crates.io
#  API token carrying BOTH the publish-new and publish-update scopes —
#  the first run creates brand-new crates.)
#
# NOTE on dry-run coverage: only the dependency-free leaf crates can be
# dry-run before anything is on crates.io. A non-leaf dry-run fails
# because its just-bumped internal deps don't exist on the registry yet
# (a fundamental limitation of interdependent workspace publishing, not
# a metadata bug). The real correctness gate is a green `just ci` before
# tagging; the per-crate verify build that `cargo publish` runs on each
# crate below is the final pre-upload check. Name availability is NOT
# checked by dry-run — verify the `aozora*` names are free on crates.io
# before the first live run.

name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no upload): packages + verifies the leaf crates"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Serialize publishes — crates.io accepts versions linearly and a
  # second concurrent run would just waste tokens.
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates

      # Metadata smoke test — always runs, even for a live dispatch, so a
      # packaging / metadata regression surfaces before any upload. Only
      # the leaf crates (no internal deps) can be dry-run pre-publish;
      # they share the inherited workspace metadata, so a clean leaf
      # dry-run validates the metadata every crate ships.
      - name: Dry-run leaf crates (metadata smoke test)
        run: |
          for crate in aozora-encoding aozora-spec aozora-veb aozora-proptest; do
            echo "::group::dry-run ${crate}"
            cargo publish -p "${crate}" --dry-run --locked
            echo "::endgroup::"
          done

      # Live publish in topological order. The loop stops on the first
      # failure (bash -eo pipefail); a mid-ladder failure leaves the
      # earlier crates published — bump the patch version and re-run,
      # skipping the crates already on crates.io.
      # Resumable + rate-limit aware. crates.io throttles NEW crates
      # (burst 5, then ~1 per 10 min), so a 13-new-crate first publish
      # cannot complete in one shot. Each crate is (a) skipped if its
      # version is already on the registry — so a re-run safely continues
      # a partial publish — and (b) retried after a wait when the upload
      # is rejected with HTTP 429.
      - name: Publish to crates.io (topological, resumable)
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          ua="aozora-release (+https://github.com/P4suta/aozora)"
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Publishing workspace version: ${ver}"
          publish_one() {
            crate="$1"
            code="$(curl -s -H "User-Agent: ${ua}" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate}/${ver}" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "::notice::skip ${crate} ${ver} (already on crates.io)"
              return 0
            fi
            tries=0
            while :; do
              tries=$((tries + 1))
              if out="$(cargo publish -p "${crate}" --locked 2>&1)"; then
                printf '%s\n' "${out}"
                echo "::notice::published ${crate} ${ver}"
                return 0
              fi
              printf '%s\n' "${out}"
              if printf '%s' "${out}" | grep -qiE '429|too many|rate.?limit'; then
                echo "::warning::rate-limited on ${crate} (attempt ${tries}); waiting 630s before retry"
                sleep 630
                continue
              fi
              echo "::error::failed to publish ${crate} (non-rate-limit error)"
              return 1
            done
          }
          for crate in \
            aozora-encoding \
            aozora-spec \
            aozora-veb \
            aozora-proptest \
            aozora-scan \
            aozora-syntax \
            aozora-pipeline \
            aozora-cst \
            aozora-query \
            aozora-render \
            aozora \
            aozora-pandoc \
            aozora-cli; do
            echo "::group::publish ${crate}"
            publish_one "${crate}" || exit 1
            echo "::endgroup::"
          done
