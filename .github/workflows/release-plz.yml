# release-plz — Rust-native version automation + crates.io publishing.
#
# Conventional Commits land on main → the `release-plz-pr` job keeps ONE
# "Release PR" open (bumps [workspace.package].version + the root CHANGELOG.md).
# A maintainer adds the `release: approved` label (ci.yml's `release-gate`
# enforces it) and squash-merges the PR by hand (no-automerge-on-release-pr.yml
# blocks auto-merge). That merge to main then makes the `release-plz-release`
# job publish every public crate to crates.io — in release-plz's own dependency
# order, via crates.io OIDC trusted publishing (no registry token) — and cut a
# single `vX.Y.Z` tag. The tag fires release.yml (binaries + GitHub Release) and
# the tag-driven PyPI / npm / extism publishers.
#
# That last hop is why release-plz runs as a GitHub App rather than on the
# default token: GitHub suppresses workflow triggers from a ref pushed with
# GITHUB_TOKEN, so a tag pushed that way would fire nothing downstream. A
# short-lived installation token is minted at runtime from
# RELEASE_PLZ_APP_CLIENT_ID + RELEASE_PLZ_APP_PRIVATE_KEY. See
# docs/contrib/releasing-secrets.md.
#
# Action pinning: third-party actions are pinned to a full commit SHA (the
# `# vX.Y.Z` trailer is the human-readable tag); Dependabot bumps them weekly.

name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact qualified Release PR merge commit to recover"
        required: true
        type: string

# Key the push-driven Release-PR flow by ref and the workflow_dispatch-driven
# publish by its exact commit, so they land in different groups and a routine
# push can never evict a queued publish; never cancel one already in flight.
concurrency:
  group: release-plz-${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-freeze:
    name: publication freeze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - name: Require a reviewed rearm
        run: |
          if [[ -e .github/RELEASE_FROZEN.md ]]; then
            echo "::error title=release frozen::remove .github/RELEASE_FROZEN.md in a reviewed rearm PR before running release-plz"
            exit 1
          fi

  # Open / update the single Release PR (version bump + CHANGELOG.md).
  release-plz-pr:
    needs: release-freeze
    if: needs.release-freeze.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The App secrets live on the release-plz environment (more scoped than
    # repository secrets — unreadable from a push on any other branch). This
    # job must declare the environment to read them; its main-only branch
    # policy admits the push/dispatch-on-main that triggers this workflow, and
    # it has no required reviewers so opening the Release PR stays unattended.
    environment: release-plz
    permissions:
      contents: write # push the release-plz-<branch> branch
      pull-requests: write # open / maintain the Release PR
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz pushes with the App token (GITHUB_TOKEN env below), not
          # the checkout-persisted credential — keep the default token out of
          # the remote so the bump push carries the App identity.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"

      # release-plz shells out to the cargo-semver-checks binary for the
      # `semver_check = true` gate (the same check `just semver` runs); without
      # it release-plz only warns and skips.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-semver-checks@0.48.0

      - name: release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # After the Release PR merges: publish to crates.io + cut the single v* tag.
  release-plz-release:
    needs: release-freeze
    # release-fan-in (or a manual rearm) dispatches this after release-ready has
    # succeeded for the commit; it never runs on the release-commit push itself,
    # so it stays workflow_dispatch-only (release-plz-pr owns the push path).
    if: needs.release-freeze.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      QUALIFIED_SHA: ${{ inputs.commit }}
    # The App key lives in this environment's secrets. Configure it with a
    # deployment-branch policy of `main` only (a workflow on any other branch
    # cannot read the credential) and NO required reviewers: the human gate is
    # merging the Release PR, so a second approval here would only stall the
    # unattended publish.
    environment: release-plz
    permissions:
      actions: read # verify release-ready on this exact commit
      contents: write # create the v* tag
      id-token: write # steady-state crates.io OIDC after the bootstrap release
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
          # Fetch tags so the rearm guard below can check whether v<version>
          # is already released.
          fetch-tags: true
          persist-credentials: false

      # `ref: <sha>` above leaves a detached HEAD; `release-plz release` resolves
      # the current branch via `git rev-parse --abbrev-ref --symbolic-full-name
      # @{upstream}` and aborts ("cannot determine current branch") without one.
      # Put HEAD on a local `main` whose upstream is origin/main. Branch config
      # alone is not enough — @{upstream} needs the remote-tracking ref present —
      # so create it at HEAD (no network; QUALIFIED_SHA is the release tip). The
      # rearm-decision step below still asserts HEAD == QUALIFIED_SHA.
      - name: Attach HEAD to a tracking branch for release-plz
        shell: bash
        run: |
          git switch -C main
          git config branch.main.remote origin
          git config branch.main.merge refs/heads/main
          git update-ref refs/remotes/origin/main HEAD

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"

      - id: detect
        uses: ./.github/actions/detect-release-commit

      # The version-standstill accept/reject rule (a rearm dispatch need not
      # bump the version, but must not re-publish an already-tagged one) is
      # `xtask release rearm-decision` — pure, unit-tested Rust rather than
      # inline bash whose workflow_dispatch branch never ran. It validates the
      # SHA/HEAD, reads QUALIFIED_SHA / GITHUB_EVENT_NAME / VERSION_CHANGED from
      # the environment, and writes `release=<bool>` to $GITHUB_OUTPUT.
      - name: Detect release commit
        id: release-commit
        shell: bash
        env:
          VERSION_CHANGED: ${{ steps.detect.outputs.version-changed }}
        run: cargo run -p aozora-xtask -q -- release rearm-decision

      - name: Require release-ready for this commit
        if: steps.release-commit.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # release-fan-in dispatches this job only after release-ready has
          # already completed successfully for QUALIFIED_SHA (and a manual
          # rearm dispatch re-qualifies first), so re-check once and fail fast
          # rather than polling.
          state="$(gh run list \
            --workflow release-ready.yml \
            --commit "$QUALIFIED_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status, (.conclusion // "")] | @tsv')"
          if [[ "$state" != $'completed\tsuccess' ]]; then
            echo "::error title=release-ready::release-ready is not completed-success for this commit (${state:-none})"
            exit 1
          fi

      - name: Verify crates.io packages are qualified bytes
        if: steps.release-commit.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" qualified "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(jq -er .commit qualified/manifest.json)" = "$QUALIFIED_SHA"
          cargo run -p aozora-xtask -q -- artifacts crates
          qualified_count=0
          for package in qualified/*.crate; do
            local_package="target/release-ready-build/crates/$(basename "$package")"
            test -s "$local_package"
            cmp "$package" "$local_package"
            qualified_count=$((qualified_count + 1))
          done
          test "$qualified_count" -gt 0
          test "$qualified_count" -eq "$(find target/release-ready-build/crates \
            -maxdepth 1 -name '*.crate' | wc -l)"

      - name: release-plz release
        if: steps.release-commit.outputs.release == 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
