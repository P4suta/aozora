# release-plz — Rust-native version automation + crates.io publishing.
#
# Conventional Commits land on main → the `release-plz-pr` job keeps ONE
# "Release PR" open (bumps [workspace.package].version + the root CHANGELOG.md).
# A maintainer adds the `release: approved` label (ci.yml's `release-gate`
# enforces it) and squash-merges the PR by hand (no-automerge-on-release-pr.yml
# blocks auto-merge). That merge to main then makes the `release-plz-release`
# job publish every public crate to crates.io — in release-plz's own dependency
# order, via crates.io OIDC trusted publishing (no registry token) — and cut a
# single `vX.Y.Z` tag. The tag fires release.yml (binaries + GitHub Release) and
# the tag-driven PyPI / npm / extism publishers.
#
# That last hop is why release-plz runs as a GitHub App rather than on the
# default token: GitHub suppresses workflow triggers from a ref pushed with
# GITHUB_TOKEN, so a tag pushed that way would fire nothing downstream. A
# short-lived installation token is minted at runtime from
# RELEASE_PLZ_APP_CLIENT_ID + RELEASE_PLZ_APP_PRIVATE_KEY. See
# docs/contrib/releasing-secrets.md.
#
# Action pinning: third-party actions are pinned to a full commit SHA (the
# `# vX.Y.Z` trailer is the human-readable tag); Dependabot bumps them weekly.

name: release-plz

on:
  push:
    branches: [main]
  # Re-runs a release that failed after the merge, and refreshes the Release PR
  # without waiting for the next push to main. Neither job has an event guard,
  # so a dispatch does exactly what a push on main does — and what that is, is
  # bounded by release-plz.toml's `release_always = false` (release only from a
  # Release-PR merge commit), not by anything here. See
  # docs/adr/0039-release-plzs-manual-trigger-stays-unguarded.md.
  workflow_dispatch:

# One release pipeline per ref; never cancel a publish already in flight.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Open / update the single Release PR (version bump + CHANGELOG.md).
  release-plz-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The App secrets live on the release-plz environment (more scoped than
    # repository secrets — unreadable from a push on any other branch). This
    # job must declare the environment to read them; its main-only branch
    # policy admits the push/dispatch-on-main that triggers this workflow, and
    # it has no required reviewers so opening the Release PR stays unattended.
    environment: release-plz
    permissions:
      contents: write # push the release-plz-<branch> branch
      pull-requests: write # open / maintain the Release PR
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # release-plz pushes with the App token (GITHUB_TOKEN env below), not
          # the checkout-persisted credential — keep the default token out of
          # the remote so the bump push carries the App identity.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      # release-plz shells out to the cargo-semver-checks binary for the
      # `semver_check = true` gate (the same check `just semver` runs); without
      # it release-plz only warns and skips.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-semver-checks

      - name: release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # After the Release PR merges: publish to crates.io + cut the single v* tag.
  release-plz-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The App key lives in this environment's secrets. Configure it with a
    # deployment-branch policy of `main` only (a workflow on any other branch
    # cannot read the credential) and NO required reviewers: the human gate is
    # merging the Release PR, so a second approval here would only stall the
    # unattended publish.
    environment: release-plz
    permissions:
      contents: write # create the v* tag
      id-token: write # crates.io OIDC trusted publishing (no CARGO_REGISTRY_TOKEN)
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
