
name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact qualified Release PR merge commit to recover"
        required: true
        type: string

concurrency:
  group: release-plz-${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-freeze:
    name: publication freeze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - name: Require a reviewed rearm
        run: |
          if [[ -e .github/RELEASE_FROZEN.md ]]; then
            echo "::error title=release frozen::remove .github/RELEASE_FROZEN.md in a reviewed rearm PR before running release-plz"
            exit 1
          fi

  release-plz-pr:
    needs: release-freeze
    if: needs.release-freeze.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-plz
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: aozora
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          tool: cargo-semver-checks@0.48.0

      - name: release-plz release-pr
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-release:
    needs: release-freeze
    if: needs.release-freeze.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      QUALIFIED_SHA: ${{ inputs.commit }}
    environment: release-plz
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: aozora
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Attach HEAD to a tracking branch for release-plz
        shell: bash
        run: |
          git switch -C main
          git config branch.main.remote origin
          git config branch.main.merge refs/heads/main
          git update-ref refs/remotes/origin/main HEAD

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - id: detect
        uses: ./.github/actions/detect-release-commit

      - name: Detect release commit
        id: release-commit
        shell: bash
        env:
          VERSION_CHANGED: ${{ steps.detect.outputs.version-changed }}
        run: cargo run -p aozora-xtask -q -- release rearm-decision

      - name: Require release-ready for this commit
        if: steps.release-commit.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # release-fan-in dispatches this job only after release-ready has
          # already completed successfully for QUALIFIED_SHA (and a manual
          # rearm dispatch re-qualifies first), so re-check once and fail fast
          # rather than polling.
          state="$(gh run list \
            --workflow release-ready.yml \
            --commit "$QUALIFIED_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status, (.conclusion // "")] | @tsv')"
          if [[ "$state" != $'completed\tsuccess' ]]; then
            echo "::error title=release-ready::release-ready is not completed-success for this commit (${state:-none})"
            exit 1
          fi

      - name: Verify crates.io packages are qualified bytes
        if: steps.release-commit.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/download-release-ready-artifact.sh \
            "release-ready-$QUALIFIED_SHA" qualified "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(jq -er .commit qualified/manifest.json)" = "$QUALIFIED_SHA"
          cargo run -p aozora-xtask -q -- artifacts crates
          qualified_count=0
          for package in qualified/*.crate; do
            local_package="target/release-ready-build/crates/$(basename "$package")"
            test -s "$local_package"
            cmp "$package" "$local_package"
            qualified_count=$((qualified_count + 1))
          done
          test "$qualified_count" -gt 0
          test "$qualified_count" -eq "$(find target/release-ready-build/crates \
            -maxdepth 1 -name '*.crate' | wc -l)"

      - name: release-plz release
        if: steps.release-commit.outputs.release == 'true'
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
