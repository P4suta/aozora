# Dependency review on pull requests.
#
# Complements the cargo-deny local gate: `cargo deny` runs inside the
# dev image and checks the full workspace against our licence +
# advisory rules, while dependency-review focuses on *changes* a PR
# introduces and comments the diff directly in the review UI.
#
# Action pinning: the actions below are pinned to full commit SHAs
# (the `# vX.Y.Z` trailer is the resolved tag); Dependabot's
# github-actions ecosystem keeps the SHAs current.

name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.2

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Match the cargo-deny policy: reject any newly introduced
          # advisory of moderate severity or worse.
          fail-on-severity: moderate

          # Mirror deny.toml's license allow-list. Keep this in sync
          # with the full cargo-deny policy; dependency-review is a
          # PR-time canary, not the source of truth.
          #
          # MIT-0 ("MIT No Attribution") is the OSI-approved no-
          # attribution variant of MIT — strictly more permissive
          # than MIT and compatible with our `Apache-2.0 OR MIT`
          # workspace licence. Listed defensively so a future
          # transitive dep on an MIT-0 crate (the recent crates.io
          # micro-utility trend) does not require a re-review.
          allow-licenses: >-
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            MIT,
            MIT-0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unicode-3.0,
            Unicode-DFS-2016,
            CC0-1.0,
            MPL-2.0,
            Zlib

          # CI-only GitHub Actions are build-time tooling — never linked
          # into or distributed with the published crates — so their
          # licenses are out of scope for our `Apache-2.0 OR MIT` product
          # policy. Swatinem/rust-cache is LGPL-3.0 (a JS action that runs
          # in CI); exempt it from the license check. The runtime-crate
          # license policy stays enforced by `allow-licenses` above and
          # authoritatively by cargo-deny (the `audit (deny)` gate). If a
          # future CI action carries a copyleft license, append its purl.
          allow-dependencies-licenses: pkg:githubactions/Swatinem/rust-cache

          # Post a summary comment only on failure so clean PRs don't
          # get a no-op drive-by from the bot.
          comment-summary-in-pr: on-failure
