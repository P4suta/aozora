# Build and publish the aozora dev container image to GHCR.
#
# This workflow exists so the main CI pipeline (ci.yml) can `docker
# pull ghcr.io/p4suta/aozora-dev:latest` instead of rebuilding the
# image from scratch on every commit. The image carries the Rust
# toolchain, nightly toolchain (for cargo-fuzz / cargo-udeps), all
# cargo dev tools (cargo-nextest, cargo-llvm-cov, cargo-deny,
# cargo-audit, cargo-cliff, cargo-semver-checks, cargo-mutants, mold
# linker, sccache, …) — building it from source on every CI run takes
# 30-40 minutes which dominates total wall-clock.
#
# Trigger conditions are deliberately narrow: the image only needs
# rebuild when the Dockerfile, docker-compose.yml, or rust-toolchain
# pin actually change. Routine source / Cargo.toml / workflow churn
# does NOT republish.
#
# The workflow tags both `:latest` (mutable, used by ci.yml's pull
# step) and `:<commit-sha>` (immutable, useful for git-bisect across
# image-affecting changes).

name: dev-image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'rust-toolchain.toml'
      - '.github/workflows/dev-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'rust-toolchain.toml'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build & push (ghcr.io/p4suta/aozora-dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        # PR builds from forks must not have GHCR credentials — we still
        # build to verify but skip the login + push there.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/p4suta/aozora-dev
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and push (ci stage)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read the registry buildcache too so even this job's own build
          # survives a GHA-cache eviction by restoring published layers.
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=ghcr.io/p4suta/aozora-dev:buildcache
          # Publish the FULL multi-stage layer cache (mode=max) to a
          # dedicated :buildcache tag, so ci.yml (and any future run whose
          # GHA scope was evicted) can restore from GHCR instead of a
          # from-scratch rebuild incl. all tool downloads. mode=max keeps
          # intermediate stages (toolchain / cargo-tools) that the final
          # image discards, which inline cache on :latest could not. Only
          # on push — fork PRs cannot authenticate to GHCR for the write.
          cache-to: |
            type=gha,mode=max,scope=dev-image
            ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/p4suta/aozora-dev:buildcache,mode=max' || '' }}
          provenance: false
