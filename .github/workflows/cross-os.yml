# Exercise platform-specific behavior between release qualifications (ADR-0042).
name: cross-os

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 cargo:cargo-nextest

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: cross-os-${{ matrix.runner }}

      - name: cargo nextest run (workspace)
        run: cargo nextest run --workspace --exclude aozora-bench --all-targets --no-fail-fast
