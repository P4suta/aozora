# aozora cross-OS behavioral test matrix
#
# Runs the workspace test suite NATIVELY on the two non-Linux release
# runners — macos-latest (aarch64-apple-darwin) and windows-2025
# (x86_64-pc-windows-msvc), the exact runners `release.yml` builds on — so
# behaviour on the platforms we SHIP is observed, not merely assumed.
#
# Behavioural, not build-only: `release.yml` only `cargo build`s on these
# runners, so a test that passes on Linux but trips over Windows path
# separators, `.aozora.toml` walk-up, or CRLF handling would ship
# undetected. This lane runs the real test binaries there.
#
# macOS and Windows runner behaviour is intrinsically platform-specific.
#
# Weekly + manual dispatch provide early warning. The release-ready workflow
# runs the same native matrix on the release commit and is the publish gate.
#
# Corpus gates need no special handling: every `AOZORA_CORPUS_ROOT`-gated
# test returns a vacuous pass when that variable is unset (it is never set
# here), so `--workspace` is safe without a corpus mount. `aozora-bench`
# is excluded — its benches drive the vendored/synthetic corpus harness and
# add no behavioural coverage the test binaries lack.
#
# Action SHAs are pinned to match the other workflows; Dependabot bumps them.
name: cross-os

on:
  schedule:
    - cron: "17 6 * * 3"  # weekly, Wednesday 06:17 UTC (offset from codeql/scorecard/link-audit)
  workflow_dispatch:

# A newer run supersedes an in-flight one on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Observe BOTH platforms every run — one failing must not mask the other.
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 cargo:cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: cross-os-${{ matrix.runner }}

      # The workspace test suite as real binaries on the shipping platform.
      # Default per-OS shell (bash on macOS, pwsh on Windows) — this single
      # cargo line is shell-agnostic, so no `shell:` override is needed.
      #
      # `--no-fail-fast`: like the matrix's `fail-fast: false`, a backstop
      # must report the FULL platform-divergence set in one run — stopping
      # at the first failing test would mask the rest and drag out the
      # fix-and-redispatch loop.
      - name: cargo nextest run (workspace)
        run: cargo nextest run --workspace --exclude aozora-bench --all-targets --no-fail-fast
