name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  LIBCLANG_PATH: /usr/lib/llvm-18/lib

jobs:
  qualify:
    runs-on: ubuntu-latest
    outputs:
      release-branch: ${{ steps.detect.outputs.release-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-release-commit
        with:
          head-ref: ${{ github.event.pull_request.head.ref }}
          same-repo: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  rust:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just lefthook cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-rust
      - run: just ci-rust

  web:
    needs: qualify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    env:
      CC_x86_64_unknown_linux_gnu: ${{ github.workspace }}/scripts/web-cc
      AR_x86_64_unknown_linux_gnu: ${{ github.workspace }}/scripts/web-ar
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/scripts/web-cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native C toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: zig
      - name: Align browser home ownership
        run: chown "$(id -u):$(id -g)" "${HOME}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just bun node cargo:wasm-pack npm:binaryen
        env:
          CRATE_CC_NO_DEFAULTS: "1"
          CFLAGS_x86_64_unknown_linux_gnu: -O3 -ffunction-sections -fdata-sections -fPIC -m64
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-web
      - name: Install web dependencies
        working-directory: playground
        run: bun install --frozen-lockfile
      - name: Restore pinned screenshot fonts
        id: font-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/web-fonts
          key: web-fonts-noble-${{ hashFiles('tools/web-fonts.sha256') }}
      - name: Download pinned screenshot fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/web-fonts
          curl --fail --location --retry 2 --remote-name-all --output-dir .cache/web-fonts \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto/fonts-noto-core_20201225-2_all.deb \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto/fonts-noto-mono_20201225-2_all.deb \
            https://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-takao/fonts-takao-gothic_00303.01-3ubuntu1_all.deb \
            https://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-takao/fonts-takao-pgothic_00303.01-3ubuntu1_all.deb
      - name: Install deterministic screenshot fonts
        run: |
          (cd .cache/web-fonts && sha256sum --check ../../tools/web-fonts.sha256)
          dpkg --install \
            .cache/web-fonts/fonts-noto-core_20201225-2_all.deb \
            .cache/web-fonts/fonts-noto-mono_20201225-2_all.deb \
            .cache/web-fonts/fonts-takao-gothic_00303.01-3ubuntu1_all.deb \
            .cache/web-fonts/fonts-takao-pgothic_00303.01-3ubuntu1_all.deb
      - run: just ci-web
      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-reports-${{ github.sha }}
          path: |
            playground/playwright-report/
            playground/test-results/
            playground/.lighthouseci/reports/
          retention-days: 7
          if-no-files-found: ignore

  bindings:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just node go npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-bindings
      - run: just ci-bindings

  repo:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.99.1 just actionlint shellcheck zizmor github:crate-ci/typos
            cargo:cargo-deny cargo:cargo-audit cargo:cargo-shear uv pipx:reuse
      - run: just ci-repo

  rust-contracts:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just cargo:cargo-nextest tree-sitter npm:quicktype node go
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-rust-contracts
      - run: just ci-rust-contracts

  release:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.99.1 just cargo:cargo-semver-checks cargo:wasm-pack
            node npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-release
      - env:
          BASELINE_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: just ci-release

  rust-lint:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just taplo github:crate-ci/typos
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-rust-lint
      - run: just ci-rust-lint

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(awk -F'\"' '/^rust-version/ { print $2; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        with:
          key: ci-msrv
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --workspace --all-targets --all-features --exclude aozora-extism
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked -p aozora-extism --all-targets

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-wasm-test
      - run: just test-wasm

  pandoc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just pandoc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-pandoc
      - run: just pandoc-smoke

  python:
    name: python (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --upgrade "maturin>=1.9,<2.0" "pytest>=8" "mypy>=1.11"
      - env:
          AOZORA_PY_VENV: ${{ runner.temp }}/aozora-py-${{ matrix.python }}
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: bash scripts/smoke-py.sh

  commitlint:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: github:crate-ci/committed
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" | xargs -rn1 committed

  release-gate:
    needs: qualify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.qualify.outputs.release-branch }}
        run: |
          if [[ "$RELEASE_BRANCH" == true ]]; then
            labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
            grep -qx "release: approved" <<<"$labels" || {
              echo "::error::add the 'release: approved' label to merge this Release PR"
              exit 1
            }
          fi

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Dependency review exceptions follow docs/adr/dependency-license-policy.md.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

          allow-licenses: >-
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            MIT,
            MIT-0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unicode-3.0,
            Unicode-DFS-2016,
            CC0-1.0,
            MPL-2.0,
            Zlib,
            BSL-1.0

          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache,
            pkg:golang/google.golang.org/protobuf,
            pkg:cargo/const-siphasher,
            pkg:cargo/filetime

          comment-summary-in-pr: on-failure

  ci-success:
    name: ci-success
    if: always()
    needs:
      - qualify
      - rust
      - rust-lint
      - rust-contracts
      - web
      - bindings
      - repo
      - release
      - msrv
      - wasm-test
      - pandoc-smoke
      - python
      - commitlint
      - release-gate
      - codeql
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
      - run: echo "ci-success"

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
