name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  qualify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ (github.event_name == 'push' && steps.detect.outputs.version-changed == 'true') || steps.detect.outputs.release-branch == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-release-commit
        with:
          head-ref: ${{ github.event.pull_request.head.ref }}
          same-repo: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  rust:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.97.0 just taplo github:crate-ci/typos cargo:cargo-nextest
            cargo:cargo-llvm-cov tree-sitter npm:quicktype node go
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-rust
      - run: just ci-rust

  web:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just bun node cargo:wasm-pack npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-web
      - name: Install Playwright system dependencies
        working-directory: playground
        run: bun x playwright install --with-deps chromium
      - run: just ci-web

  bindings:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just node go npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-bindings
      - run: just ci-bindings

  repo:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.97.0 just actionlint shellcheck zizmor github:crate-ci/typos
            cargo:cargo-deny cargo:cargo-audit cargo:cargo-shear uv pipx:reuse
      - run: just ci-repo

  corpus:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    env:
      AOZORA_CORPUS_ROOT: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-release-inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AOZORA_CORPUS_REPOSITORY }}
          ref: ${{ env.AOZORA_CORPUS_SHA }}
          path: .corpus
          fetch-depth: 1
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-corpus
      - run: just ci-corpus

  performance:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-performance
      - env:
          BASELINE_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just ci-perf

  release:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.97.0 just cargo:cargo-semver-checks cargo:wasm-pack
            node npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-release
      - run: just ci-release

  fuzz-build:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@nightly-2026-07-15 just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-fuzz
      - run: just ci-fuzz

  mutants-in-diff:
    needs: qualify
    if: github.event_name == 'pull_request' && needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just cargo:cargo-mutants
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --no-color "${BASE_SHA}...HEAD" > pr.diff
      - run: >-
          just mutants --in-diff pr.diff
          --exclude 'crates/aozora/src/pandoc/**'
          --exclude 'crates/aozora/src/fmt.rs'
          --exclude 'crates/aozora/src/json.rs'
          --shard '${{ matrix.shard }}'
          --sharding round-robin

  arm64:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-arm64
      - run: just test-aarch64

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(awk -F'\"' '/^rust-version/ { print $2; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - id: toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        with:
          key: ci-msrv
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: cargo check --locked --workspace --all-targets --all-features --exclude aozora-extism
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: cargo check --locked -p aozora-extism --all-targets

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-wasm-test
      - run: just test-wasm

  pandoc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.97.0 pandoc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-pandoc
      - run: cargo build --locked --release -p aozora-cli
      - run: |
          input='｜青梅《おうめ》'
          html=$(printf '%s' "$input" | ./target/release/aozora pandoc --to html)
          grep -F 'aozora-ruby' <<<"$html"
          grep -F '青梅' <<<"$html"
          grep -F 'おうめ' <<<"$html"

  python:
    name: python (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --upgrade "maturin>=1.9,<2.0" "pytest>=8" "mypy>=1.11"
      - env:
          AOZORA_PY_VENV: ${{ runner.temp }}/aozora-py-${{ matrix.python }}
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: bash scripts/smoke-py.sh

  commitlint:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: github:crate-ci/committed
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" | xargs -rn1 committed

  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if grep -qx "autorelease: pending" <<<"$labels"; then
            grep -qx "release: approved" <<<"$labels" || {
              echo "::error::add the 'release: approved' label to merge this Release PR"
              exit 1
            }
          fi

  ci-success:
    name: ci-success
    if: always()
    needs:
      - qualify
      - rust
      - web
      - bindings
      - repo
      - corpus
      - performance
      - release
      - fuzz-build
      - mutants-in-diff
      - arm64
      - msrv
      - wasm-test
      - pandoc-smoke
      - python
      - commitlint
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
      - run: echo "ci-success"
