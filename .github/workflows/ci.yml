name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  qualify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ (github.event_name == 'push' && steps.detect.outputs.version-changed == 'true') || steps.detect.outputs.release-branch == 'true' }}
      release-branch: ${{ steps.detect.outputs.release-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-release-commit
        with:
          head-ref: ${{ github.event.pull_request.head.ref }}
          same-repo: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  rust:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.99.1 just taplo github:crate-ci/typos cargo:cargo-nextest
            cargo:cargo-llvm-cov tree-sitter npm:quicktype node go
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-rust
      - run: just ci-rust

  web:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just bun node cargo:wasm-pack npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-web
      - name: Install web dependencies
        working-directory: playground
        run: bun install --frozen-lockfile
      - name: Install Playwright system dependencies
        working-directory: playground
        run: bun run playwright install --with-deps chromium firefox webkit
      - name: Install deterministic screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-takao-gothic
      - run: just ci-web
      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-reports-${{ github.sha }}
          path: |
            playground/playwright-report/
            playground/test-results/
            playground/.lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore

  bindings:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just node go npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-bindings
      - run: just ci-bindings

  repo:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.99.1 just actionlint shellcheck zizmor github:crate-ci/typos
            cargo:cargo-deny cargo:cargo-audit cargo:cargo-shear uv pipx:reuse
      - run: just ci-repo

  corpus:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    env:
      AOZORA_CORPUS_ROOT: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-release-inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AOZORA_CORPUS_REPOSITORY }}
          ref: ${{ env.AOZORA_CORPUS_SHA }}
          path: .corpus
          fetch-depth: 1
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-corpus
      - run: just ci-corpus

  performance:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev valgrind
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-performance
      - env:
          BASELINE_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just ci-perf

  release:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.99.1 just cargo:cargo-semver-checks cargo:wasm-pack
            node npm:binaryen
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-release
      - run: just ci-release

  fuzz-build:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@nightly-2026-07-15 just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-fuzz
      - run: just ci-fuzz

  mutants-in-diff:
    needs: qualify
    if: github.event_name == 'pull_request' && needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just cargo:cargo-mutants cargo:cargo-nextest
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --no-color "${BASE_SHA}...HEAD" > pr.diff
      - run: >-
          just mutants --in-diff pr.diff
          --exclude 'crates/aozora/src/pandoc/**'
          --exclude 'crates/aozora/src/fmt.rs'
          --exclude 'crates/aozora/src/json.rs'
          --shard '${{ matrix.shard }}'
          --sharding round-robin

  arm64:
    needs: qualify
    if: needs.qualify.outputs.release != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-arm64
      - run: just test-aarch64

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(awk -F'\"' '/^rust-version/ { print $2; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        with:
          key: ci-msrv
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --workspace --all-targets --all-features --exclude aozora-extism
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked -p aozora-extism --all-targets

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-wasm-test
      - run: just test-wasm

  pandoc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.99.1 pandoc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-pandoc
      - run: cargo build --locked --release -p aozora-cli
      - run: |
          input='｜青梅《おうめ》'
          html=$(printf '%s' "$input" | ./target/release/aozora pandoc --to html)
          grep -F 'aozora-ruby' <<<"$html"
          grep -F '青梅' <<<"$html"
          grep -F 'おうめ' <<<"$html"
          gaiji='※［＃「木＋吶のつくり」、第3水準1-85-54］'
          plain=$(printf '%s' "$gaiji" | ./target/release/aozora pandoc --to plain)
          test "$plain" = '枘'

  python:
    name: python (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --upgrade "maturin>=1.9,<2.0" "pytest>=8" "mypy>=1.11"
      - env:
          AOZORA_PY_VENV: ${{ runner.temp }}/aozora-py-${{ matrix.python }}
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: bash scripts/smoke-py.sh

  commitlint:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
          install_args: github:crate-ci/committed
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" | xargs -rn1 committed

  release-gate:
    needs: qualify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.qualify.outputs.release-branch }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if [[ "$RELEASE_BRANCH" == true ]]; then
            grep -qx "release: approved" <<<"$labels" || {
              echo "::error::add the 'release: approved' label to merge this Release PR"
              exit 1
            }
          fi

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Match cargo-deny's advisory threshold.
          fail-on-severity: moderate

          # Mirror deny.toml's license allow-list.
          # MIT-0 permits attribution-free use compatible with the workspace license.
          # BSL-1.0 covers rustyline's Windows-only clipboard dependencies.
          allow-licenses: >-
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            MIT,
            MIT-0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unicode-3.0,
            Unicode-DFS-2016,
            CC0-1.0,
            MPL-2.0,
            Zlib,
            BSL-1.0

          # rust-cache runs only in CI and is not distributed with the crates.
          # protobuf's permissive Go patent grant is not recognized as an SPDX license.
          # const-siphasher uses legacy MIT/Apache-2.0 metadata accepted by cargo-deny.
          # filetime uses legacy MIT/Apache-2.0 metadata accepted by cargo-deny.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache,
            pkg:golang/google.golang.org/protobuf,
            pkg:cargo/const-siphasher,
            pkg:cargo/filetime

          comment-summary-in-pr: on-failure

  ci-success:
    name: ci-success
    if: always()
    needs:
      - qualify
      - rust
      - web
      - bindings
      - repo
      - corpus
      - performance
      - release
      - fuzz-build
      - mutants-in-diff
      - arm64
      - msrv
      - wasm-test
      - pandoc-smoke
      - python
      - commitlint
      - release-gate
      - codeql
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
      - run: echo "ci-success"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
