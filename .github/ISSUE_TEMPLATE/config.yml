blank_issues_enabled: false
contact_links:
  - name: Security report (parser crashes, HTML-escape bypass, panics on untrusted input)
    url: https://github.com/P4suta/aozora/security/advisories/new
    about: Open a **private** security advisory. Do not file security issues publicly.

  - name: Conduct concern
    url: https://github.com/P4suta/aozora/security/advisories/new
    about: Code of conduct reports also go through private security advisories — mark the title clearly as a conduct report.

  - name: 青空文庫記法 (Aozora notation) spec questions
    url: https://github.com/P4suta/aozora-notation-spec
    about: aozora implements the processor-neutral 青空文庫記法 spec; questions about the notation itself (not this implementation) belong with the spec.
