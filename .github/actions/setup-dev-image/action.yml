# Composite action: install `just` on the runner and provision the
# aozora dev image.
#
# Used by every ci.yml job that invokes `just <target>`. The image is
# built ONCE per workflow run by the upstream `dev-image` job (which runs
# this same action), saved to the runner tar cache, and then restored by
# every `needs: dev-image` job via `docker load` — so the slow image
# build happens at most once per run.
#
# On a tar-cache MISS (the `dev-image` job itself, or a fresh dev-image
# input hash), the image is built FROM THE IN-TREE Dockerfile through the
# GitHub Actions build-layer cache (`type=gha`). It is NOT pulled from
# GHCR and NOT built inline via `docker compose build`:
#   - Building from the in-tree Dockerfile guarantees the image matches
#     THIS checkout, so a PR that adds a tool to the Dockerfile runs
#     against an image that actually has it (the stale-`:latest` bug).
#   - The `type=gha` layer cache means the heavy `cargo binstall`
#     (cargo-tools) layer is reused instead of re-fetched live. The live
#     binstall path was hitting GitHub's unauthenticated API rate limit
#     (403) and failing `audit (deny)`.
# No GHCR, no token, no cross-workflow coordination — mirrors the proven
# `book` job in ci.yml.

name: setup-dev-image
description: Provision the aozora dev image (restore from cache or build via the GHA layer cache) and install `just`.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
      with:
        tool: just

    # Install the sccache CLI on the runner host and export
    # ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN so the in-container
    # sccache (compose env: RUSTC_WRAPPER=sccache, SCCACHE_GHA_ENABLED=true
    # via docker-compose.ci.yml) can route its cache traffic over the
    # GitHub Actions Cache API. The on-disk `sccache` named volume in
    # docker-compose.yml is fine for local dev where it persists across
    # invocations, but every CI runner starts with empty named volumes,
    # so on Actions we steer sccache at the run-shared GHA cache instead.
    - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Enable docker-compose CI overlay
      shell: bash
      run: echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml" >> "$GITHUB_ENV"

    # Run the compose containers as root on CI. The image defaults to a
    # non-root user (UID 1000) so local bind-mount writes are host-owned,
    # but the runner's checkout is owned by a different UID — a non-root
    # container can't create files (wasm pkg/, generated docs, coverage
    # reports) inside runner-owned tree directories. Ownership is throwaway
    # on the ephemeral runner, so root is the simplest correct choice. Read
    # by `user:` in docker-compose.yml via the AOZORA_UID/AOZORA_GID defaults.
    - name: Run compose containers as root on CI
      shell: bash
      run: |
        {
          echo "AOZORA_UID=0"
          echo "AOZORA_GID=0"
        } >> "$GITHUB_ENV"

    # Cache the dev image tar on the runner host. The upstream `dev-image`
    # job builds the image once and saves it here; every dependent job
    # restores it and `docker load`s it instead of rebuilding. The key is
    # keyed off Dockerfile + docker-compose.yml + rust-toolchain.toml so a
    # real image rebuild invalidates it automatically. v3: the v2 entries
    # were saved by the old GHCR-pull / inline-`docker compose build` path;
    # bump to invalidate them and switch to the GHA-layer-cache build.
    - name: Cache dev image tar
      id: dev-image-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /tmp/aozora-dev.tar
        key: aozora-dev-image-v3-${{ hashFiles('Dockerfile', 'docker-compose.yml', 'rust-toolchain.toml') }}

    - name: Load dev image from cache (cache hit)
      if: steps.dev-image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        docker load -i /tmp/aozora-dev.tar
        docker tag aozora-dev:local aozora-ci:local
        echo "::notice title=dev image::Loaded aozora-dev:local from runner cache"

    # Cache MISS → build from the in-tree Dockerfile via the GHA
    # build-layer cache. `cache-from` lists the ci-owned scope first and
    # the dev-image.yml scope second: on a cold ci scope the second hits
    # the layers dev-image.yml already built (so the heavy `cargo binstall`
    # layer is reused, never re-fetched live). `cache-to` writes the
    # ci-owned scope only, to avoid clobbering dev-image.yml's scope.
    - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      if: steps.dev-image-cache.outputs.cache-hit != 'true'

    - name: Build dev image (GHA layer cache)
      if: steps.dev-image-cache.outputs.cache-hit != 'true'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        target: ci
        load: true
        push: false
        provenance: false
        tags: aozora-dev:local
        cache-from: |
          type=gha,scope=ci-dev-image
          type=gha,scope=dev-image
        cache-to: type=gha,mode=max,scope=ci-dev-image

    - name: Tag + save built image
      if: steps.dev-image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        docker tag aozora-dev:local aozora-ci:local
        # Save the tar so actions/cache picks it up on the post-action and
        # dependent (`needs: dev-image`) jobs restore it instead of rebuilding.
        docker save aozora-dev:local -o /tmp/aozora-dev.tar
        echo "::notice title=dev image::Built aozora-dev:local from the in-tree Dockerfile (GHA layer cache)"
