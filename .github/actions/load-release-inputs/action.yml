# Composite action: load the pinned conformance inputs into the job env.
#
# `.github/release-inputs.env` is the single source of truth for the corpora,
# specification, and real-work lab repositories + revisions that release gates pin to.
# This action reads it and exports the required keys into `$GITHUB_ENV`, so every
# consumer references `${{ env.AOZORA_* }}` (including in a later `with:`)
# instead of hard-coding its own copy of the SHA. One source, no duplicate to
# drift, so no cross-file coherence check is needed.
#
# Fails closed unless each key occurs once and names an immutable input.

name: load-release-inputs
description: Export every pinned release-input repository and SHA from .github/release-inputs.env into the job environment.

inputs:
  env-file:
    description: Repository-relative release-input file to validate and load.
    required: false
    default: .github/release-inputs.env

runs:
  using: composite
  steps:
    - id: load
      shell: bash
      env:
        RELEASE_INPUTS_ENV: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        env_file="$RELEASE_INPUTS_ENV"
        test -f "$env_file" || { echo "::error::$env_file not found"; exit 1; }
        for key in AOZORA_CORPUS_REPOSITORY AOZORA_CORPUS_SHA \
                   AOZORA_SPEC_REPOSITORY AOZORA_SPEC_SHA \
                   AOZORA_REAL_WORK_CORPUS_REPOSITORY \
                   AOZORA_REAL_WORK_CORPUS_SHA \
                   AOZORA_REAL_WORK_LAB_REPOSITORY \
                   AOZORA_REAL_WORK_LAB_SHA; do
          match_count=$(grep -Ec "^${key}=" "$env_file" || true)
          if [[ "$match_count" -ne 1 ]]; then
            echo "::error::$key must occur exactly once in $env_file"
            exit 1
          fi
          value=$(grep -E "^${key}=" "$env_file")
          value=${value#*=}
          case "$key" in
            *_REPOSITORY)
              if [[ ! "$value" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?/[A-Za-z0-9_.-]+$ ]]; then
                echo "::error::$key must be an owner/repository name in $env_file"
                exit 1
              fi
              ;;
            *_SHA)
              if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::$key must be a full lowercase commit SHA in $env_file"
                exit 1
              fi
              ;;
          esac
          printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
        done
