# Composite action: classify the checked-out HEAD as a release commit.
#
# The single source of truth for release-commit detection. The two
# primitives below were copy-pasted across release-ready.yml (qualify),
# docs.yml, and release-plz.yml; each caller now derives its own release
# policy (dispatch handling, push-only guards, tag existence) from the
# primitives instead of re-implementing the git-diff probe.
#
# Requires a checkout with fetch-depth >= 2 so `git diff HEAD^` can resolve
# the parent commit.

name: detect-release-commit
description: Emit release-commit primitives (version-line change, release-plz branch head) for the checked-out HEAD.

inputs:
  head-ref:
    description: PR head ref to test against the release-plz-* pattern; empty on push/dispatch.
    default: ""
  same-repo:
    description: >
      "true" only when the PR head branch lives in this repository, not a fork
      (callers pass `github.event.pull_request.head.repo.full_name ==
      github.repository`). Gates `release-branch`, so an outside contributor
      cannot name a fork branch `release-plz-*` to trigger the heavy
      release-ready matrix (and make ci defer its Rust graph). Defaults to
      "false": recognizing a release-plz head is opt-in per caller, so a caller
      that forgets the assertion fails safe (no trigger) rather than open.
    default: "false"

outputs:
  version-changed:
    description: "true when HEAD's diff against its parent touches a top-level `version = ` line in Cargo.toml."
    value: ${{ steps.detect.outputs.version-changed }}
  release-branch:
    description: "true when head-ref matches release-plz-* AND the head is a same-repo (non-fork) branch."
    value: ${{ steps.detect.outputs.release-branch }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head-ref }}
        SAME_REPO: ${{ inputs.same-repo }}
      run: |
        set -euo pipefail
        version_changed=false
        # Capture first: `git diff | grep -Eq` SIGPIPEs git under pipefail
        # (grep exits on the first match, closing the pipe) — the DEV-105 class.
        version_diff="$(git diff HEAD^ -- Cargo.toml)"
        if grep -Eq '^[+-]version = ' <<<"$version_diff"; then
          version_changed=true
        fi
        release_branch=false
        if [[ "$HEAD_REF" == release-plz-* && "$SAME_REPO" == true ]]; then
          release_branch=true
        fi
        echo "version-changed=$version_changed" >> "$GITHUB_OUTPUT"
        echo "release-branch=$release_branch" >> "$GITHUB_OUTPUT"
