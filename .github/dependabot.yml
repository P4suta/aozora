version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 20
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Keep SHA pins fresh; human-readable tag comments are updated automatically.
    # `dtolnay/rust-toolchain` is now SHA-pinned (to a `master` commit) with an
    # explicit `toolchain:` input, so its action *code* no longer rides a moving
    # branch and the SHA can be bumped like any other action — no ignore needed.
    groups:
      actions-sha-bumps:
        patterns: ["*"]

  - package-ecosystem: docker
    # Bumps Dockerfile FROM pins. Currently: rust (toolchain stage) and
    # ubuntu (book stage).
    #
    # The `rust` base follows rust-toolchain.toml's channel — the DEV
    # toolchain, which is deliberately NOT the MSRV (ADR-0034). It is
    # therefore *supposed* to track stable, so the former `ignore` here is
    # gone: a dependabot `rust` PR is now a useful signal that a new stable
    # shipped. The MSRV (Cargo.toml's `rust-version`) is a separate,
    # measured number that none of this touches.
    #
    # Such a PR lands RED on purpose. Dependabot cannot edit
    # rust-toolchain.toml or the mise manifest, so `xtask msrv check` (in
    # drift-gate) fails until a maintainer syncs the channel in the same
    # PR. That gate is what makes the un-ignore safe — do not re-add the
    # ignore without also removing the gate's reason to exist.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    # JS/TS surfaces: the playground, the VS Code extension, and the
    # tree-sitter node bindings. NOTE: the playground uses Bun (bun.lockb);
    # Dependabot's Bun-lockfile support is limited, so there it mainly bumps
    # the package.json ranges. The extension + tree-sitter bindings update fully.
    directories:
      - "/playground"
      - "/editors/vscode"
      - "/crates/tree-sitter-aozora"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    # aozora-py is a maturin/PyO3 native extension; pip watches its pyproject
    # build/runtime deps. The CI-only tools (maturin/twine/pytest/mypy) are
    # `pip install`-ed inline in the workflows, not declared in a manifest, so
    # Dependabot cannot track them — bump those by hand in the workflow files.
    directory: "/crates/aozora-py"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
