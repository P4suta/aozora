version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 20
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ADR-0033 rejects the ICU identifier split introduced in 0.14.
      - dependency-name: fluent-langneg
        versions: [">=0.14"]
      # 7.6.0 declares the non-SPDX expression MIT/Apache-2.0.
      - dependency-name: hdrhistogram
        versions: ["7.6.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Keep SHA pins fresh; human-readable tag comments are updated automatically.
    # `dtolnay/rust-toolchain` is now SHA-pinned (to a `master` commit) with an
    # explicit `toolchain:` input, so its action *code* no longer rides a moving
    # branch and the SHA can be bumped like any other action — no ignore needed.
    groups:
      actions-sha-bumps:
        patterns: ["*"]

  - package-ecosystem: bun
    directories:
      - "/playground"
      - "/editors/vscode"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-majors:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # VS Code typings track the minimum supported editor, not an independent
      # library. Raise this ceiling together with `engines.vscode` and the
      # Electron/Node target asserted by editors/vscode/esbuild.mjs.
      - dependency-name: "@types/vscode"
        versions: [">1.91.0"]

  - package-ecosystem: npm
    directory: "/crates/tree-sitter-aozora"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-majors:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    # aozora-py is a maturin/PyO3 native extension; pip watches its pyproject
    # build/runtime deps. The CI-only tools (maturin/twine/pytest/mypy) are
    # `pip install`-ed inline in the workflows, not declared in a manifest, so
    # Dependabot cannot track them — bump those by hand in the workflow files.
    directory: "/crates/aozora-py"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
